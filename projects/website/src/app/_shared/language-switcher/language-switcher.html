@if (variant() === 'compact') {
<button type="button" class="compact" [attr.aria-label]="changeLabel" (click)="switchLocale(otherLocale())">
  <mh-line-icon name="globe" />
  <span>{{ currentLabel() }}</span>
</button>
} @else {
<div class="flex items-center" [class]="variant() === 'segmented' ? 'gap-1' : 'gap-0.5'" role="group" i18n-aria-label="@@langSwitcher.aria" aria-label="Language selection">
  @for (locale of locales(); track locale.code) {
  @let active = currentLocale() === locale.code;
  @if (variant() === 'segmented') {
  <button type="button" class="seg" [class.seg--active]="active" [attr.aria-pressed]="active"
    (click)="switchLocale(locale.code)">
    {{ locale.label }}
  </button>
  } @else {
  <button class="px-2 py-1 text-xs font-semibold rounded transition-colors"
    [class.text-primary-500]="active" [class.font-bold]="active"
    [class.text-surface-400]="!active" [class.cursor-pointer]="!active"
    [class.hover:text-surface-900]="!active"
    [class.dark:hover:text-surface-100]="!active" (click)="switchLocale(locale.code)"
    [attr.aria-pressed]="active" type="button">
    {{ locale.label }}
  </button>
  @if (!$last) {
  <span class="text-surface-300 dark:text-surface-600 select-none">|</span>
  }
  }
  }
</div>
}
