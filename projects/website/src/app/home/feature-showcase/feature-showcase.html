<!-- The arrows sit with the tabs, which are the thing that scrolls. Over the
     clip they read as video controls, which these are not. -->
<div class="fs__rail">
  <button
    type="button"
    class="fs__arrow fs__arrow--prev"
    [disabled]="!canPrev()"
    (click)="step(-1)"
    aria-label="Previous feature"
    i18n-aria-label="@@home.fs.prev"
  >
    <i class="pi pi-chevron-left" aria-hidden="true"></i>
  </button>

  <!-- Bleeds to the screen edge so the row reads as scrollable without a hint. -->
  <div class="fs__tabs" #tabs role="tablist" aria-label="Features" i18n-aria-label="@@home.fs.tabs">
  @for (f of features(); track f.slug; let i = $index) {
    <button
      type="button"
      role="tab"
      class="fs__tab"
      [class.is-active]="active() === i"
      [attr.aria-selected]="active() === i"
      aria-controls="fs-panel"
      (click)="select(i)"
    >
      <span class="fs__tab-ic" aria-hidden="true">{{ f.icon }}</span>
        <span class="fs__tab-name">{{ f.name }}</span>
      </button>
    }
  </div>

  <button
    type="button"
    class="fs__arrow fs__arrow--next"
    [disabled]="!canNext()"
    (click)="step(1)"
    aria-label="Next feature"
    i18n-aria-label="@@home.fs.next"
  >
    <i class="pi pi-chevron-right" aria-hidden="true"></i>
  </button>
</div>

@if (current(); as f) {
  <div class="fs__panel" id="fs-panel" role="tabpanel">
    <div class="fs__clip">
      <!-- The still sits under the clip: it is what a reader sees before the
           first frames arrive, and all they see where no clip exists yet. -->
      @if (near()) {
        <img class="fs__shot" [src]="shotFor(f.slug)" alt="" decoding="async" />
      }

      @if (f.preview; as clip) {
        <!-- Keyed on the slug so switching tabs builds a new element rather
             than swapping src on a playing one, which kept the old frames. -->
        @for (key of [f.slug]; track key) {
          <video
            #vid
            class="fs__video"
            [src]="near() ? clip : null"
            muted
            loop
            playsinline
            preload="none"
            aria-hidden="true"
          ></video>
        }
      }

      <span class="fs__count">{{ position() }}</span>

    </div>

    <h3 class="fs__name">{{ f.name }}</h3>
    <p class="fs__line">{{ f.oneLiner }}</p>

    <!-- Side by side: two full-width links stacked read as a dead end. -->
    <div class="fs__links">
      <a class="fs__link" [routerLink]="['/features', f.slug]">
        <span i18n="@@home.fs.how">See how it works</span>
        <i class="pi pi-arrow-right" aria-hidden="true"></i>
      </a>
      <a class="fs__link fs__link--muted" routerLink="/features">
        <span i18n="@@home.fs.all">See all features</span>
      </a>
    </div>
  </div>
}
