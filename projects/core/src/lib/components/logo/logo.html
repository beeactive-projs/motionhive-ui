<div class="container" [class.container--sm]="size() === 'sm'">
  <img src="svg/logo-navy.svg" alt="MotionHive logo" [class]="styleClass() + ' dark:hidden'">
  <img src="svg/logo-honey.svg" alt="MotionHive logo" [class]="styleClass() + ' hidden dark:block'">
  <div class="font-heading font-extrabold title-color mr-auto"
    [class]="size() === 'sm' ? 'text-lg' : 'text-xl sm:text-2xl'" aria-hidden="true">
    MotionHive
  </div>
</div>
