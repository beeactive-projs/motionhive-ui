<div class="logo" [class.logo--sm]="size() === 'sm'">
  <!-- width/height are the SVG's viewBox: they fix the mark's size before the
       file loads (styleClass caps the width, the height follows the ratio). -->
  <img src="svg/logo-honey.svg" alt="MotionHive logo" width="168" height="190" [class]="styleClass()">
  <div class="font-heading font-extrabold text-primary mr-auto"
    [class]="size() === 'sm' ? 'text-lg' : 'text-xl sm:text-2xl'" aria-hidden="true">
    MotionHive
  </div>
</div>
