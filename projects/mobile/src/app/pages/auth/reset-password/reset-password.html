<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth/login" />
    </ion-buttons>
    <ion-title>Reset password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="auth-container">
    <div class="ion-padding-horizontal">
      <p>
        Enter the email address linked to your account and we'll send you instructions to reset
        your password.
      </p>
    </div>

    @if (successMessage()) {
      <ion-text color="success" role="status" class="ion-padding-horizontal">
        <p>{{ successMessage() }}</p>
      </ion-text>
    }

    @if (errorMessage()) {
      <ion-text color="danger" role="alert" class="ion-padding-horizontal">
        <p>{{ errorMessage() }}</p>
      </ion-text>
    }

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <div class="ion-margin-horizontal">
        <ion-input
          fill="outline"
          label="Email address"
          labelPlacement="stacked"
          type="email"
          inputmode="email"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
          enterkeyhint="send"
          [errorText]="getFieldError('email')"
          [class.ion-invalid]="isFieldInvalid('email')"
          [class.ion-touched]="isFieldInvalid('email')"
        />
      </div>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="isLoading()"
        class="ion-margin-horizontal ion-margin-top"
      >
        @if (isLoading()) {
          <ion-spinner name="crescent" />
        } @else {
          Send reset instructions
        }
      </ion-button>
    </form>
  </div>
</ion-content>
