<ion-tabs>
  <ion-tab-bar slot="bottom" [selectedTab]="activeTabId()" [class.ion-hide]="hideTabBar()">
    @for (tab of tabs(); track tab.id) {
      <ion-tab-button [tab]="tab.id">
        <ion-icon [name]="tab.icon" aria-hidden="true" />
        <ion-label>{{ tab.label }}</ion-label>
        @if (tab.badge; as unread) {
          @if (unread() > 0) {
            <ion-badge color="danger">{{ unread() }}</ion-badge>
          }
        }
      </ion-tab-button>
    }

    <!--
      No `tab` attribute on purpose: without one Ionic's own click handler
      short-circuits and never navigates, leaving (click) free to open the
      sheet. A real /tabs/more route would add a junk history entry and a
      fifth, permanently empty navigation stack.
    -->
    <ion-tab-button aria-label="More" (click)="openMore()">
      <ion-icon name="ellipsis-horizontal" aria-hidden="true" />
      <ion-label>More</ion-label>
      <!-- A dot, not a count: it only has to say "something is in here". -->
      @if (hasBillDue()) {
        <ion-badge color="danger" class="dot" aria-label="You have a bill due"></ion-badge>
      }
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<mh-more-sheet [(open)]="moreOpen" [tiles]="moreTiles()" />

<!-- Outside <ion-tabs> so it survives tab switches and floats over whichever
     page is on screen. -->
<mh-notification-banner />
