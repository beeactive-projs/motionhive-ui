<ion-tabs (ionTabsDidChange)="onTabsDidChange()">
  <!-- The workout in progress, over the tab bar on every screen but its own
       and the Workouts page while its resume card shows, and out of the way
       with the tab bar while the keyboard is up. -->
  <mh-active-workout-bar
    slot="bottom"
    [class.ion-hide]="onLogger() || hideTabBar() || keyboardUp() || resumeCardOnScreen()"
  />
  <ion-tab-bar
    slot="bottom"
    [selectedTab]="litTab()"
    [class.ion-hide]="hideTabBar()"
    (ionTabButtonClick)="onTabButtonClick($event)"
  >
    @for (tab of tabs(); track tab.id) {
      <ion-tab-button [tab]="tab.id">
        <ion-icon [name]="tab.icon" aria-hidden="true" />
        <ion-label>{{ tab.label | translate }}</ion-label>
        @if (tab.id === 'workouts' && activeWorkout()) {
          <!-- A workout is open: a honey dot, not a count. -->
          <ion-badge color="primary" class="dot" [attr.aria-label]="'workouts.activeBar.dot' | translate"></ion-badge>
        }
        @if (tab.badge; as count) {
          @if (count() > 0) {
            <!-- Messages: honey, like the unread badge and time on the inbox
                 rows. Clients: red, the requests waiting on an answer. -->
            <ion-badge
              [color]="tab.badgeColor ?? 'primary'"
              [attr.aria-label]="tab.badgeLabel ? (tab.badgeLabel | translate: { count: count() }) : null"
              >{{ count() }}</ion-badge
            >
          }
        }
      </ion-tab-button>
    }

    <!-- A real tab, Messenger-style: the menu is a page with its own stack,
         and the button lights up while you are in it. -->
    <ion-tab-button tab="more">
      <ion-icon name="menu-outline" aria-hidden="true" />
      <ion-label>{{ 'nav.menu' | translate }}</ion-label>
      <!-- A dot, not a count: it only has to say "something is in here"
           (a bill due, a coach's invitation waiting). -->
      @if (menuDot(); as label) {
        <ion-badge color="danger" class="dot" [attr.aria-label]="label | translate"></ion-badge>
      }
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<!-- Outside <ion-tabs> so it survives tab switches and floats over whichever
     page is on screen. -->
<mh-notification-banner />

<!-- Any photo full screen (`mhViewPhoto`), over whichever page opened it. -->
<mh-photo-viewer />

<!-- Opened by the "Save as routine" offer on the toast after a workout; the
     screen that made the offer is gone by the time it is taken up. -->
<mh-save-routine-sheet />

<!-- A start that ran into another open workout: resume, finish or discard it. -->
<mh-start-conflict-sheet />
