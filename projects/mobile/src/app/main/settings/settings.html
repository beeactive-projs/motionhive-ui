<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true">
    <ion-list-header>
      <ion-label>Appearance</ion-label>
    </ion-list-header>
    <ion-radio-group [value]="themePreference()" (ionChange)="onThemeChange($event.detail.value)">
      <ion-item>
        <ion-radio [value]="ThemePreferences.System">System</ion-radio>
      </ion-item>
      <ion-item>
        <ion-radio [value]="ThemePreferences.Light">Light</ion-radio>
      </ion-item>
      <ion-item>
        <ion-radio [value]="ThemePreferences.Dark">Dark</ion-radio>
      </ion-item>
    </ion-radio-group>
  </ion-list>

  <ion-list [inset]="true">
    <ion-list-header>
      <ion-label>Account</ion-label>
    </ion-list-header>
    <ion-item button [detail]="false" [disabled]="isSigningOut()" (click)="onSignOut()">
      <ion-icon slot="start" name="log-out-outline" color="danger" aria-hidden="true" />
      <ion-label color="danger">Sign out</ion-label>
    </ion-item>
  </ion-list>

  <ion-toast
    message="Theme updated"
    [isOpen]="themeToastOpen()"
    [duration]="1500"
    (didDismiss)="themeToastOpen.set(false)"
  />
</ion-content>
