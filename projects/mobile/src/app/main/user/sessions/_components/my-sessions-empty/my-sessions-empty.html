<div class="empty">
  <mh-hex-avatar
    [name]="'mySessions.empty.title' | translate"
    icon="calendar-outline"
    size="xl"
    color="primary"
    tone="wash"
  />

  <h2>{{ 'mySessions.empty.title' | translate }}</h2>
  <p>{{ message() }}</p>

  <div class="actions">
    <ion-button expand="block" (click)="browse.emit()">{{ 'mySessions.empty.browse' | translate }}</ion-button>
  </div>
</div>
