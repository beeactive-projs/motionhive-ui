<ion-item-sliding #sliding>
  <!-- A full swipe commits: read is reversible, so it may. -->
  <ion-item-options side="start" (ionSwipe)="emitAndClose(sliding, toggleRead)">
    <ion-item-option
      color="primary"
      [expandable]="true"
      [attr.aria-label]="isUnread() ? 'Mark read' : 'Mark unread'"
      (click)="emitAndClose(sliding, toggleRead)"
    >
      <ion-icon slot="icon-only" name="checkmark-done-outline" />
    </ion-item-option>
  </ion-item-options>

  <ion-item button detail="false" lines="none" (click)="select.emit()">
    <mh-hex-avatar
      slot="start"
      size="sm"
      tone="wash"
      aria-hidden="true"
      [icon]="style().icon"
      [color]="style().color"
    />

    <ion-label>
      <div class="head">
        @if (isUnread()) {
        <span class="dot" aria-label="Unread"></span>
        }
        <span class="title">{{ notification().title }}</span>
        <ion-note>{{ time() }}</ion-note>
      </div>
      <p class="body">{{ notification().body }}</p>
    </ion-label>

    @if (hasTarget()) {
    <ion-icon slot="end" name="chevron-forward" color="medium" aria-hidden="true" />
    }
  </ion-item>

  <!-- Dismiss sits at the screen edge and is the one a full swipe commits.
       Ionic moves the `expandable` option outermost mid-swipe (`order: 1`), so
       it lives there in the DOM too and never jumps. Delete is never
       expandable: a full swipe must not reach an action you cannot undo. -->
  <ion-item-options side="end" (ionSwipe)="emitAndClose(sliding, dismiss)">
    <ion-item-option color="danger" aria-label="Delete" (click)="emitAndClose(sliding, remove)">
      <ion-icon slot="icon-only" name="trash-outline" />
    </ion-item-option>
    <ion-item-option color="medium" [expandable]="true" (click)="emitAndClose(sliding, dismiss)">
      Dismiss
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
