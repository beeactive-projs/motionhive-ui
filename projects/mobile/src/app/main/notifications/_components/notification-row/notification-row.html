<ion-item-sliding #sliding>
  <!-- Swipe right: Read / Unread. A full swipe commits: read is reversible, so it may. -->
  <ion-item-options side="start" (ionSwipe)="emitAndClose(sliding, toggleRead)">
    <ion-item-option color="primary" [expandable]="true" (click)="emitAndClose(sliding, toggleRead)">
      <ion-icon
        slot="top"
        aria-hidden="true"
        [name]="isUnread() ? 'checkmark-done-outline' : 'mail-unread-outline'"
      />
      {{ (isUnread() ? 'notifications.markRead' : 'notifications.markUnread') | translate }}
    </ion-item-option>
  </ion-item-options>

  <ion-item button detail="false" (click)="select.emit()">
    <!-- The unread dot rides in the gutter left of the tile, as in Mail. It is
         absolutely placed (see the scss), so it takes no room in the row. -->
    @if (isUnread()) {
      <span slot="start" class="unread-dot" role="img" [attr.aria-label]="'a11y.unread' | translate"></span>
    }
    <mh-hex-avatar
      slot="start"
      size="lg"
      tone="wash"
      aria-hidden="true"
      [icon]="style().icon"
      [color]="style().color"
    />

    <ion-label>
      <div class="mh-row-line">
        <h2>{{ notification().title }}</h2>
        <ion-note class="time">{{ time() }}</ion-note>
      </div>
      <p>{{ notification().body }}</p>
    </ion-label>
  </ion-item>

  <!-- Dismiss sits at the screen edge and is the one a full swipe commits.
       Ionic moves the `expandable` option outermost mid-swipe (`order: 1`), so
       it lives there in the DOM too and never jumps. Delete is never
       expandable: a full swipe must not reach an action you cannot undo. -->
  <ion-item-options side="end" (ionSwipe)="emitAndClose(sliding, dismiss)">
    <ion-item-option color="danger" (click)="emitAndClose(sliding, remove)">
      <ion-icon slot="top" name="trash-outline" aria-hidden="true" />
      {{ 'button.delete' | translate }}
    </ion-item-option>
    <ion-item-option color="medium" [expandable]="true" (click)="emitAndClose(sliding, dismiss)">
      <ion-icon slot="top" name="eye-off-outline" aria-hidden="true" />
      {{ 'button.dismiss' | translate }}
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
