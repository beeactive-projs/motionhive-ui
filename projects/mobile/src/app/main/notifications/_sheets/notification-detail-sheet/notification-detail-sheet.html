<!-- The whole message, which the row cuts to one line, and where it lives when
     this app has no screen for it, before the verbs about it. -->
<ng-template #details>
  @if (notification(); as item) {
    <div class="message">
      <p class="body">{{ item.body }}</p>
      @if (elsewhere(); as place) {
        <p class="mh-footnote">
          {{ 'notifications.detail.webOnly' | translate: { place: place } }}
        </p>
      }
    </div>
  }
</ng-template>

<mh-action-sheet
  [(open)]="open"
  [title]="title()"
  [subtitle]="eyebrow()"
  [details]="details"
  [actions]="actions()"
  (chosen)="onChosen($event)"
/>
