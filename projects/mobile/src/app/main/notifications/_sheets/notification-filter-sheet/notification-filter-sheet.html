<ng-template #body>
  <div class="mh-section-label">{{ 'form.label.status' | translate }}</div>
  <div class="mh-chip-cloud">
    <ion-button
      class="chip"
      fill="clear"
      shape="round"
      size="small"
      [class.selected]="!draft().unreadOnly"
      [attr.aria-pressed]="!draft().unreadOnly"
      (click)="setUnreadOnly(false)"
    >
      {{ 'common.all' | translate }}
    </ion-button>
    <ion-button
      class="chip"
      fill="clear"
      shape="round"
      size="small"
      [class.selected]="draft().unreadOnly"
      [attr.aria-pressed]="draft().unreadOnly"
      (click)="setUnreadOnly(true)"
    >
      {{ 'notifications.filter.unread' | translate }}
    </ion-button>
  </div>

  <div class="mh-section-label">{{ 'notifications.filter.category' | translate }}</div>
  <div class="mh-chip-cloud">
    @for (option of categoryOptions; track option.value) {
      <ion-button
        class="chip"
        fill="clear"
        shape="round"
        size="small"
        [class.selected]="isPicked(option.value)"
        [attr.aria-pressed]="isPicked(option.value)"
        (click)="toggleCategory(option.value)"
      >
        {{ option.label }}
      </ion-button>
    }
  </div>

  <ion-note class="mh-note-block">
    {{ 'notifications.filter.note' | translate }}
  </ion-note>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'common.filters' | translate"
  [actionLabel]="'button.reset' | translate"
  [actionDisabled]="count() === 0"
  [saveLabel]="applyLabel()"
  [body]="body"
  (action)="reset()"
  (save)="apply()"
/>
