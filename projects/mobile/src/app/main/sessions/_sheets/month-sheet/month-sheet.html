<ng-template #body>
  <div class="nav">
    <ion-button fill="clear" aria-label="Previous month" (click)="step(-1)">
      <ion-icon slot="icon-only" name="chevron-back" />
    </ion-button>
    <span class="label">{{ monthLabel() }}</span>
    <ion-button fill="clear" aria-label="Next month" (click)="step(1)">
      <ion-icon slot="icon-only" name="chevron-forward" />
    </ion-button>
    <button type="button" class="today" (click)="goToday()">Today</button>
  </div>

  <div class="grid heading">
    @for (label of weekdayLabels; track $index) {
      <span class="weekday">{{ label }}</span>
    }
  </div>

  <div class="grid">
    @for (cell of cells(); track cell.key) {
      <button
        type="button"
        class="cell"
        [class.muted]="!cell.inMonth"
        [class.today]="cell.isToday"
        [class.staged]="cell.key === stagedKey()"
        [attr.aria-pressed]="cell.key === stagedKey()"
        (click)="pick(cell)"
      >
        <span class="day">{{ cell.day }}</span>
        <span class="dots">
          @for (tone of cell.dots; track $index) {
            <i [attr.data-tone]="tone"></i>
          }
        </span>
      </button>
    }
  </div>

  <div class="legend">
    @for (entry of legend; track entry.label) {
      <span class="entry">
        <i [attr.data-tone]="entry.tone"></i>
        {{ entry.label }}
      </span>
    }
  </div>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  title="Jump to"
  [body]="body"
  [saveLabel]="jumpLabel()"
  [canSave]="staged() !== null"
  [breakpoints]="[0, 0.8]"
  [initialBreakpoint]="0.8"
  (save)="jump()"
/>
