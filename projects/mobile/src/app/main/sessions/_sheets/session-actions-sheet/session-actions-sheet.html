<ng-template #body>
  <ion-list lines="none">
    <ion-item class="head" lines="full">
      <span slot="start" class="time">{{ time() }}</span>
      <ion-label class="ion-text-wrap">
        <h3>{{ title() }}</h3>
        <span class="mh-kicker">{{ meta() }}</span>
      </ion-label>
    </ion-item>

    @for (item of visibleActions(); track item.id) {
      <ion-item
        button
        [detail]="false"
        [class.destructive]="item.destructive"
        (click)="choose(item.id)"
      >
        <ion-icon slot="start" [name]="item.icon" [color]="item.color" aria-hidden="true" />
        <ion-label>{{ item.label }}</ion-label>
      </ion-item>
    }
  </ion-list>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  title="Session actions"
  [body]="body"
  [showHeader]="false"
  [showFooter]="false"
  [flushBody]="true"
  [breakpoints]="[0, 0.6]"
  [initialBreakpoint]="0.6"
/>
