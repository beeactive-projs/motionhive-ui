<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/workouts" />
    </ion-buttons>
    <ion-title>{{ 'workouts.common.history' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content />
  </ion-refresher>

  @if (store.showError()) {
    <mh-empty-state
      icon="alert-circle-outline"
      [heading]="'workouts.loadError.history' | translate"
      [message]="'error.checkConnection' | translate"
      [actionLabel]="'button.tryAgain' | translate"
      (action)="retry()"
    />
  } @else {
    <div class="mh-page">
      <!-- An empty month is still a month: the calendar stays above the empty state. -->
      <mh-history-calendar
        [cells]="store.calendarCells()"
        [month]="store.month()"
        [doneCount]="store.monthDoneCount()"
        [collapsed]="store.collapsed()"
        [loading]="store.monthSkeleton()"
        [error]="store.monthError()"
        (collapsedChange)="store.setCollapsed($event)"
        (monthChange)="store.setMonth($event)"
        (daySelect)="onDaySelect($event)"
        (retry)="store.refreshMonth()"
      />

      @if (store.showSkeleton()) {
        <!-- Mirrors the row shape so nothing shifts when the rows land. -->
        <span class="mh-kicker meta">
          <ion-skeleton-text [animated]="true" style="width: 9rem; height: 0.75rem" />
        </span>
        <div>
          @for (_ of skeletonRows; track $index) {
            <mh-session-row-skeleton />
          }
        </div>
      } @else if (store.isEmpty()) {
        <mh-empty-state
          icon="time-outline"
          [heading]="'workouts.history.empty.title' | translate"
          [message]="'workouts.history.empty.message' | translate"
        />
      } @else {
        <span class="mh-kicker meta">{{ store.countLabel() }}</span>
        <div>
          @for (log of store.items(); track log.id) {
            <mh-log-row
              [attr.data-day]="dayKeys().get(log.id)"
              [log]="log"
              [repeatable]="true"
              [showSource]="true"
              (select)="open(log)"
              (repeat)="repeat(log)"
            />
          }
        </div>
      }
    </div>

    <ion-infinite-scroll [disabled]="!store.hasMore()" (ionInfinite)="onLoadMore($event)">
      <ion-infinite-scroll-content />
    </ion-infinite-scroll>
  }
</ion-content>
