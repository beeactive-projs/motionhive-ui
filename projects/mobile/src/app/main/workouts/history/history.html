<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/workouts" />
    </ion-buttons>
    <ion-title>History</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content />
  </ion-refresher>

  @if (store.showError()) {
    <mh-empty-state
      icon="alert-circle-outline"
      heading="Couldn't load your history"
      message="Check your connection and try again."
      actionLabel="Try again"
      (action)="retry()"
    />
  } @else if (store.showSkeleton()) {
    <!-- Mirrors the row shape so nothing shifts when the rows land. -->
    <div class="mh-page">
      <span class="mh-kicker meta">
        <ion-skeleton-text [animated]="true" style="width: 9rem; height: 0.75rem" />
      </span>
      <div>
        @for (_ of skeletonRows; track $index) {
          <mh-session-row-skeleton />
        }
      </div>
    </div>
  } @else if (store.isEmpty()) {
    <mh-empty-state
      icon="time-outline"
      heading="Nothing logged yet"
      message="Finish a workout and it will show up here."
    />
  } @else {
    <div class="mh-page">
      <span class="mh-kicker meta">{{ store.countLabel() }}</span>
      <div>
        @for (log of store.items(); track log.id) {
          <mh-log-row [log]="log" [repeatable]="true" (select)="open(log)" (repeat)="repeat(log)" />
        }
      </div>
    </div>

    <ion-infinite-scroll [disabled]="!store.hasMore()" (ionInfinite)="onLoadMore($event)">
      <ion-infinite-scroll-content />
    </ion-infinite-scroll>
  }
</ion-content>
