<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/workouts" />
    </ion-buttons>
    <ion-title>{{ 'workouts.common.starterRoutines' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (showError()) {
    <mh-empty-state
      icon="alert-circle-outline"
      [heading]="'workouts.loadError.starters' | translate"
      [message]="'error.checkConnection' | translate"
      [actionLabel]="'button.tryAgain' | translate"
      (action)="load()"
    />
  } @else if (isEmpty()) {
    <mh-empty-state
      icon="flash-outline"
      [heading]="'workouts.starters.empty.title' | translate"
      [message]="'workouts.starters.empty.message' | translate"
      [actionLabel]="'button.tryAgain' | translate"
      actionFill="outline"
      (action)="load()"
    />
  } @else {
    <div class="mh-page">
      <ion-note class="mh-note-block">{{ 'workouts.starters.note' | translate }}</ion-note>

      @if (showSkeleton()) {
        <!-- Mirrors the row shape so nothing shifts when the rows land. -->
        <div>
          @for (_ of skeletonRows; track $index) {
            <mh-session-row-skeleton [rail]="false" />
          }
        </div>
      } @else {
        <div>
          @for (routine of routines(); track routine.id; let i = $index) {
            <mh-routine-row
              [routine]="routine"
              [tone]="routineTone(i)"
              [starter]="true"
              (select)="open(routine)"
            />
          }
        </div>
      }
    </div>
  }
</ion-content>
