<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [attr.aria-label]="'a11y.back' | translate" defaultHref="/tabs/workouts" />
    </ion-buttons>
    <ion-title>{{ 'workouts.archived.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (showError()) {
    <mh-empty-state
      icon="alert-circle-outline"
      [heading]="'workouts.archived.loadError' | translate"
      [message]="'error.checkConnection' | translate"
      [actionLabel]="'button.tryAgain' | translate"
      (action)="load()"
    />
  } @else if (isEmpty()) {
    <mh-empty-state
      icon="archive-outline"
      [heading]="'workouts.archived.empty.title' | translate"
      [message]="'workouts.archived.empty.message' | translate"
    />
  } @else {
    <div class="mh-page">
      <ion-note class="mh-note-block">{{ 'workouts.archived.note' | translate }}</ion-note>
      @if (showSkeleton()) {
        <!-- Mirrors the row shape so nothing shifts when the rows land. -->
        <ion-list [inset]="true" class="mh-card-list" aria-hidden="true">
          @for (_ of skeletonRows; track $index) {
            <ion-item>
              <mh-hex-avatar slot="start" size="md" color="medium" tone="wash" />
              <ion-label>
                <ion-skeleton-text [animated]="true" style="width: 55%" />
                <ion-skeleton-text [animated]="true" style="width: 35%" />
              </ion-label>
            </ion-item>
          }
        </ion-list>
      } @else {
        <ion-list [inset]="true" class="mh-card-list">
          @for (routine of routines(); track routine.id; let i = $index) {
            <!-- Swipe left to unarchive, all the way or onto the button. -->
            <mh-routine-row
              [routine]="routine"
              [color]="routineTileColor(i)"
              [swipe]="Swipes.Unarchive"
              (select)="open(routine)"
              (unarchive)="unarchive(routine)"
            />
          }
        </ion-list>
      }
    </div>
  }
</ion-content>
