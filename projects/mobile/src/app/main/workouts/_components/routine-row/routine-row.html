<ion-item button [detail]="detail()" lines="none" (click)="select.emit()">
  <!-- Decorative: the name it would announce is the very next thing in the row. -->
  <mh-hex-avatar slot="start" size="md" tone="wash" icon="flash-outline" [color]="color()" />

  <ion-label class="ion-text-wrap">
    <h2>{{ routine().name }}</h2>
    <p>{{ meta() }}</p>
  </ion-label>

  @if (level(); as value) {
    <ion-badge slot="end" [attr.data-tone]="levelTone(value)">{{ levelLabel(value) }}</ion-badge>
  }
</ion-item>
