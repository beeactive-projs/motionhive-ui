<ion-item button [detail]="detail() && !startable()" lines="none" (click)="select.emit()">
  <!-- Decorative: the name it would announce is the very next thing in the row. -->
  <mh-hex-avatar slot="start" size="md" tone="wash" icon="flash-outline" [color]="color()" />

  <!-- The level rides the meta line rather than the row's end, so the name
       has the row's width: beside an end badge, at large text, a long
       Romanian name broke inside a word ("echipamen/t"). -->
  <ion-label class="ion-text-wrap">
    <h2>{{ routine().name }}</h2>
    @if (level(); as value) {
      <div class="meta">
        <p>{{ meta() }}</p>
        <ion-badge [attr.data-tone]="levelTone(value)">{{ levelLabel(value) }}</ion-badge>
      </div>
    } @else {
      <p>{{ meta() }}</p>
    }
  </ion-label>
  @if (startable()) {
    <ion-button
      slot="end"
      shape="round"
      class="mh-row-action"
      [disabled]="starting()"
      (click)="onStart($event)"
    >
      {{ 'button.start' | translate }}
    </ion-button>
  }
</ion-item>
