<!-- A row with a verb never takes taps itself: the button is the one control,
     not a button inside a button. -->
<ion-list [inset]="true" class="mh-card-list resume">
  <ion-item>
    <mh-hex-meter slot="start" size="md" [phase]="meterPhase()" [left]="left()" [icon]="icon()" />
    <ion-label>
      <h2>{{ name() }}</h2>
      <span class="meta" [class.ok]="ok()">{{ meta().key | translate: meta().params }}</span>
    </ion-label>
    <ion-button slot="end" class="mh-row-action" (click)="act()">
      {{ buttonKey() | translate }}
    </ion-button>
  </ion-item>
</ion-list>
