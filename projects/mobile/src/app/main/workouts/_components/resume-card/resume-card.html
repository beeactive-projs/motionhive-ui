<!-- A row with a verb never takes taps itself: Resume is the one control,
     not a button inside a button. -->
<ion-list [inset]="true" class="mh-card-list resume">
  <ion-item>
    <mh-hex-avatar slot="start" size="sm" color="coral" [icon]="icon()" />
    <ion-label>
      <span class="mh-kicker">
        {{
          (paused() ? 'workouts.home.paused' : 'workouts.home.inProgress')
            | translate: { elapsed: elapsed() }
        }}
      </span>
      <h2>{{ name() }}</h2>
    </ion-label>
    <ion-button slot="end" class="mh-row-action" (click)="resume.emit()">
      {{ 'button.resume' | translate }}
    </ion-button>
  </ion-item>
</ion-list>
