<div class="mh-set-grid row" [class.done]="mode() === Modes.Done" [class.selected]="editing() !== null">
  <!-- The set's options (type, copy, note, delete), on its number. -->
  <button
    type="button"
    class="badge-button"
    [attr.aria-label]="'workouts.setRow.menu' | translate: { name: badge().name }"
    (click)="menu.emit()"
  >
    <span [class]="'badge tone-' + badge().tone" aria-hidden="true">{{ badge().text }}</span>
  </button>

  <!-- Last time's numbers for this set; a tap copies them in. In its column
       the numbers alone, under the heading; too narrow for the column, a
       line under the fields that says what they are. -->
  <button
    type="button"
    class="previous"
    [class.empty]="!previous()"
    [disabled]="!previous() || set().isCompleted"
    [attr.aria-label]="
      previous()
        ? ('workouts.setRow.usePrevious' | translate: { name: badge().name, value: previous() })
        : ('workouts.setRow.noPrevious' | translate: { name: badge().name })
    "
    (click)="usePrevious.emit()"
  >
    <span class="in-column">{{ previous() || '–' }}</span>
    @if (previous()) {
      <span class="in-line">{{ 'workouts.logger.last' | translate: { value: previous() } }}</span>
    }
  </button>

  @for (cell of cells(); track cell.field) {
    <button
      type="button"
      class="field"
      [class.active]="cell.active"
      [class.prefill]="cell.prefill"
      [class.long]="cell.long"
      [attr.aria-label]="'workouts.setRow.cellLabel' | translate: { field: cell.field, number: badge().text }"
      (click)="edit.emit(cell.field)"
    >
      {{ cell.text || '–' }}
      @if (cell.unit) {
        <span class="unit">{{ cell.unit | translate }}</span>
      }
    </button>
  }

  <!-- A tick alone is a valid log: never gated on a value being typed. -->
  <button
    type="button"
    class="tick"
    [class.on]="set().isCompleted"
    [attr.aria-pressed]="set().isCompleted"
    [attr.aria-label]="
      (set().isCompleted ? 'workouts.setRow.untick' : 'workouts.setRow.complete')
        | translate: { name: badge().name, number: badge().text }
    "
    (click)="tick.emit()"
  >
    <ion-icon name="checkmark-outline" aria-hidden="true" />
  </button>
</div>

@if (rpe() || set().notes) {
  <p class="set-note">
    @if (rpe(); as value) {
      <span class="rpe">{{ 'workouts.effort.rpe' | translate: { value } }}</span>
    }
    @if (set().notes; as note) {
      <span class="note">{{ note }}</span>
    }
  </p>
}
