<div class="scale" role="radiogroup" [attr.aria-label]="label()" [attr.aria-readonly]="!editable() || null">
  @for (feeling of feelings; track feeling.value) {
    <button
      type="button"
      class="cell"
      role="radio"
      [class.on]="value() === feeling.value"
      [attr.aria-checked]="value() === feeling.value"
      [attr.aria-label]="('workouts.finish.rating' | translate: { value: feeling.value }) + ', ' + (feeling.label | translate)"
      [disabled]="!editable()"
      (click)="pick(feeling)"
    >
      <span class="hex" [style.aspect-ratio]="frame.aspect">
        <svg [attr.viewBox]="frame.viewBox" aria-hidden="true">
          <defs>
            <clipPath [attr.id]="clipId(feeling)">
              <path [attr.d]="hex().d" />
            </clipPath>
          </defs>
          <path class="comb" [attr.d]="hex().d" />
          <g [attr.clip-path]="'url(#' + clipId(feeling) + ')'">
            <rect
              class="honey"
              x="0"
              width="100"
              [attr.y]="hex().y"
              [attr.height]="hex().height"
              [style.transform]="honeyScale(feeling)"
            />
          </g>
          <path class="rim" [attr.d]="hex().d" />
        </svg>
        <span class="glyph" aria-hidden="true">{{ feeling.glyph }}</span>
      </span>
      <span class="label" aria-hidden="true">{{ feeling.label | translate }}</span>
    </button>
  }
</div>
