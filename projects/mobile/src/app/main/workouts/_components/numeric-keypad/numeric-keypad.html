<div class="pad" role="group" [attr.aria-label]="label() || ('workouts.keypad.numberPad' | translate)">
  <div class="head">
    @if (label()) {
      <span class="mh-kicker">{{ label() }}</span>
    }
    <output class="draft">{{ display() }}</output>

    <div class="steppers">
      <button type="button" [attr.aria-label]="'workouts.keypad.minus' | translate: { step: stepLabel() }" (click)="step(-1)">
        −{{ stepLabel() }}
      </button>
      <button type="button" [attr.aria-label]="'workouts.keypad.plus' | translate: { step: stepLabel() }" (click)="step(1)">
        +{{ stepLabel() }}
      </button>
    </div>

    <ion-button fill="clear" shape="round" color="medium" [attr.aria-label]="'workouts.keypad.close' | translate" (click)="dismiss.emit()">
      <ion-icon slot="icon-only" name="chevron-down-outline" aria-hidden="true" />
    </ion-button>
  </div>

  <div class="keys">
    @for (key of keys; track key) {
      <button type="button" (click)="press(key)">{{ key }}</button>
    }

    @if (allowsDecimal() && !isClock()) {
      <button type="button" (click)="press('.')">.</button>
    } @else {
      <button type="button" class="ghost" [attr.aria-label]="'button.clear' | translate" (click)="clear()">C</button>
    }

    <button type="button" (click)="press('0')">0</button>

    <button type="button" class="ghost" [attr.aria-label]="'workouts.keypad.backspace' | translate" (click)="backspace()">
      <ion-icon name="backspace-outline" aria-hidden="true" />
    </button>
  </div>

  <ion-button expand="block" class="done" (click)="commit.emit(committed())">{{ 'button.done' | translate }}</ion-button>
</div>
