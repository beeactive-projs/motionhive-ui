@if (session()) {
  <!-- Named by the hidden line, not an aria-label: ion-item copies an
       aria-label to its button once, when it loads, so the name never
       followed the rest. The button's content is read as it is now. -->
  <ion-item button detail="false" lines="none" class="bar" (click)="open()">
    <mh-hex-meter slot="start" size="md" [phase]="meterPhase()" [left]="left()" [icon]="icon()" />
    <ion-label aria-hidden="true">
      <span class="title">{{ title() }}</span>
      <span class="sub">{{ sub() }}</span>
    </ion-label>
    @if (right()) {
      <span
        slot="end"
        class="right"
        aria-hidden="true"
        [class.muted]="paused()"
        [class.small]="over()"
        >{{ right() }}</span
      >
    }
    <span class="mh-visually-hidden">{{ label() }}</span>
  </ion-item>
}
