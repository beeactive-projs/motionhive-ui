<ion-item
  class="mh-session-row mh-list-row"
  [button]="openable()"
  detail="false"
  lines="none"
  [attr.data-tone]="tone()"
  (click)="onSelect()"
>
  <div class="when" slot="start">
    <span class="time">{{ rail().day }}</span>
    <span class="duration">{{ rail().weekday }}</span>
  </div>

  <ion-label>
    <h2>{{ log().name }}</h2>
    <div class="tags">
      @if (records(); as badge) {
        <ion-badge [attr.data-tone]="badge.tone">{{ badge.label }}</ion-badge>
      }
      @if (sourceChip(); as source) {
        <ion-badge [attr.data-tone]="source.tone">{{ source.label }}</ion-badge>
      }
      @if (chip(); as chip) {
        <ion-badge [attr.data-tone]="chip.tone">{{ chip.label }}</ion-badge>
      }
      @if (meta()) {
        <ion-note>{{ meta() }}</ion-note>
      }
    </div>
  </ion-label>

  <!-- A skipped plan day has nothing to repeat or open. -->
  @if (repeatable() && openable()) {
    <ion-button
      slot="end"
      fill="clear"
      shape="round"
      [attr.aria-label]="'workouts.logRow.repeat' | translate: { name: log().name }"
      (click)="onRepeat($event)"
    >
      <ion-icon slot="icon-only" name="refresh-outline" aria-hidden="true" />
    </ion-button>
  } @else if (openable()) {
    <ion-icon slot="end" name="chevron-forward-outline" color="medium" aria-hidden="true" />
  }
</ion-item>
