<ion-card>
  <ion-card-content>
    <span class="mh-kicker eyebrow">{{ eyebrow() }}</span>

    <h2>{{ workout().name }}</h2>

    @if (position()) {
      <span class="mh-kicker position">{{ position() }}</span>
    }

    @if (meta()) {
      <p class="meta">{{ meta() }}</p>
    }

    <ion-button expand="block" (click)="start.emit()">
      <ion-icon slot="start" name="play-outline" aria-hidden="true" />
      Start workout
    </ion-button>
  </ion-card-content>
</ion-card>
