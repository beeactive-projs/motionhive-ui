<div class="bar" [class.done]="done()" role="timer" aria-live="polite">
  <div class="count">
    <span class="mh-kicker">{{ done() ? 'Rest over' : 'Rest' }}</span>
    <strong>{{ display() }}</strong>
  </div>

  @if (nextTarget()) {
    <span class="next">Next: {{ nextTarget() }}</span>
  }

  <div class="actions">
    <ion-button size="small" shape="round" fill="outline" color="medium" aria-label="Minus 10 seconds" (click)="subtract()">
      −10
    </ion-button>
    <ion-button size="small" shape="round" fill="outline" color="medium" aria-label="Plus 10 seconds" (click)="add()">
      +10
    </ion-button>
    <ion-button size="small" shape="round" class="skip" (click)="skip.emit()">
      <ion-icon slot="start" name="play-skip-forward-outline" aria-hidden="true" />
      Skip
    </ion-button>
  </div>
</div>
