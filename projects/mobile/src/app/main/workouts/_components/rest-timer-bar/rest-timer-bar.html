<div [class]="'bar state-' + state()">
  <div class="top">
  <!-- The hexagon and the time are one button: tap to change the rest. -->
  <button
    type="button"
    class="clock"
    [attr.aria-label]="'workouts.restTimer.change' | translate"
    (click)="change.emit()"
  >
    <span class="hex">
      <svg [attr.viewBox]="hex.viewBox" aria-hidden="true">
        <defs>
          <clipPath [attr.id]="clipId"><path [attr.d]="hex.d" /></clipPath>
        </defs>
        <path class="hex-base" [attr.d]="hex.d" />
        <rect
          class="hex-fill"
          [attr.x]="hex.x"
          [attr.y]="fillY()"
          [attr.width]="hex.width"
          [attr.height]="fillHeight()"
          [attr.clip-path]="'url(#' + clipId + ')'"
        />
      </svg>
      @if (state() === States.Go) {
        <ion-icon name="checkmark-outline" aria-hidden="true" />
      } @else if (state() === States.Over) {
        <ion-icon name="add-outline" aria-hidden="true" />
      }
    </span>
    <span class="time-block" role="timer" aria-live="polite">
      <strong class="time">{{ display() }}</strong>
      <span class="sub">{{ sub() }}</span>
    </span>
  </button>

  <span class="actions">
    @if (counting()) {
      <button
        type="button"
        class="step"
        [attr.aria-label]="'workouts.restTimer.minusSeconds' | translate: { seconds: nudgeSeconds }"
        (pointerdown)="holdStart(-1, $event)"
        (pointerup)="holdEnd()"
        (pointerleave)="holdEnd()"
        (pointercancel)="holdEnd()"
        (click)="stepByKey(-1, $event)"
      >
        −{{ nudgeSeconds }}
      </button>
      <button
        type="button"
        class="step"
        [attr.aria-label]="'workouts.restTimer.plusSeconds' | translate: { seconds: nudgeSeconds }"
        (pointerdown)="holdStart(1, $event)"
        (pointerup)="holdEnd()"
        (pointerleave)="holdEnd()"
        (pointercancel)="holdEnd()"
        (click)="stepByKey(1, $event)"
      >
        +{{ nudgeSeconds }}
      </button>
      <button type="button" class="quiet" (click)="skip.emit()">{{ 'button.skip' | translate }}</button>
    } @else {
      <button type="button" class="start" (click)="start.emit()">{{ 'workouts.restTimer.startSet' | translate }}</button>
      <button type="button" class="quiet" (click)="hide.emit()">{{ 'workouts.restTimer.hide' | translate }}</button>
    }
  </span>
  </div>

  <!-- Its own line, the bar's full width: next to the keys it was squeezed
       to nothing, in Romanian most of all. -->
  @if (next()) {
    <p class="next">
      <span class="next-label">{{ 'workouts.restTimer.next' | translate }}</span>
      <span class="next-text">{{ next() }}</span>
    </p>
  }
</div>
