<div class="bar" [class.done]="done()">
  <!-- How much of the rest has gone, along the top edge. -->
  <div class="elapsed" aria-hidden="true">
    <span [style.width.%]="elapsedPercent()"></span>
  </div>

  <div class="body">
    <div class="count" role="timer" aria-live="polite">
      <span class="mh-kicker">{{ (done() ? 'workouts.restTimer.restOver' : 'workouts.restTimer.rest') | translate }}</span>
      <strong>{{ display() }}</strong>
    </div>

    @if (nextTitle()) {
      <div class="next">
        <span class="mh-kicker">{{ 'workouts.restTimer.nextUp' | translate }}</span>
        <strong>{{ nextTitle() }}</strong>
        @if (nextDetail()) {
          <span class="detail">{{ nextDetail() }}</span>
        }
      </div>
    }
  </div>

  <div class="actions">
    <button type="button" [attr.aria-label]="'workouts.restTimer.minusSeconds' | translate: { seconds: nudgeSeconds }" (click)="subtract()">
      −{{ 'workouts.keypad.stepSeconds' | translate: { step: nudgeSeconds } }}
    </button>
    <button type="button" [attr.aria-label]="'workouts.restTimer.plusSeconds' | translate: { seconds: nudgeSeconds }" (click)="add()">
      +{{ 'workouts.keypad.stepSeconds' | translate: { step: nudgeSeconds } }}
    </button>
    <button type="button" class="skip" (click)="skip.emit()">{{ 'button.skip' | translate }}</button>
  </div>
</div>
