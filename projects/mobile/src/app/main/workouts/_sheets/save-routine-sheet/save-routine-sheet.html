<ng-template #body>
  <ion-input
    mode="md"
    fill="outline"
    [label]="'form.label.name' | translate"
    labelPlacement="stacked"
    [maxlength]="maxLength"
    [value]="name()"
    (ionInput)="name.set($event.detail.value ?? '')"
  />
</ng-template>

<!-- What saving does is the subtitle, not a helper line over the field:
     `.mh-helper` is the line under a field. A text field, so the sheet opens
     tall: the keyboard takes the bottom half. -->
<mh-sheet-shell
  [open]="service.isOpen()"
  (openChange)="onOpenChange($event)"
  [title]="'workouts.finish.saveAsRoutine.title' | translate"
  [subtitle]="'workouts.finish.saveAsRoutine.message' | translate"
  [saveLabel]="'workouts.finish.saveAsRoutine.action' | translate"
  [body]="body"
  [breakpoints]="[0, 0.95]"
  [initialBreakpoint]="0.95"
  [canSave]="!!name().trim()"
  [saving]="saving()"
  (save)="save()"
/>
