<ng-template #body>
  <div class="mh-stack">
    <!-- The common rests as option chips, the one in use picked in honey. -->
    <div
      class="mh-chip-cloud presets"
      role="group"
      [attr.aria-label]="'workouts.restSheet.title' | translate"
    >
      @for (preset of presets; track preset) {
        <ion-button
          class="chip"
          fill="clear"
          size="small"
          [class.selected]="value() === preset"
          [attr.aria-pressed]="value() === preset"
          (click)="value.set(preset)"
        >
          {{ label(preset) }}
        </ion-button>
      }
    </div>

    <div class="mh-stepper" role="group" [attr.aria-label]="'workouts.restSheet.title' | translate">
      <ion-button
        fill="clear"
        shape="round"
        [attr.aria-label]="'workouts.restSheet.less' | translate: { seconds: step }"
        (click)="nudge(-1)"
      >
        <ion-icon slot="icon-only" name="remove-outline" aria-hidden="true" />
      </ion-button>
      <span class="value" aria-live="polite">{{ display() }}</span>
      <ion-button
        fill="clear"
        shape="round"
        [attr.aria-label]="'workouts.restSheet.more' | translate: { seconds: step }"
        (click)="nudge(1)"
      >
        <ion-icon slot="icon-only" name="add-outline" aria-hidden="true" />
      </ion-button>
    </div>

    <!-- Who it is for: one of two, picked with a tap, so radio semantics on
         the shared pick tiles (honey border and wash on the picked one). The
         footnote speaks to the choice, so it sits under it. -->
    <section class="mh-section">
      <div class="mh-stack" role="radiogroup" [attr.aria-label]="'workouts.restSheet.scope' | translate">
        @if (exerciseName()) {
          <button
            type="button"
            role="radio"
            class="scope mh-pick-tile"
            [class.on]="scope() === Scopes.Exercise"
            [attr.aria-checked]="scope() === Scopes.Exercise"
            (click)="scope.set(Scopes.Exercise)"
          >
            <span class="label">{{ 'workouts.restSheet.exercise' | translate }}</span>
            <span class="hint">
              {{ 'workouts.restSheet.exerciseHint' | translate: { name: exerciseName() } }}
            </span>
          </button>
        }
        <button
          type="button"
          role="radio"
          class="scope mh-pick-tile"
          [class.on]="scope() === Scopes.Workout"
          [attr.aria-checked]="scope() === Scopes.Workout"
          (click)="scope.set(Scopes.Workout)"
        >
          <span class="label">{{ 'workouts.restSheet.workout' | translate }}</span>
          <span class="hint">{{ 'workouts.restSheet.workoutHint' | translate }}</span>
        </button>
      </div>
      <p class="mh-footnote">{{ 'workouts.restSheet.footnote' | translate }}</p>
    </section>
  </div>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'workouts.restSheet.title' | translate"
  [body]="body"
  [fit]="true"
  [saveLabel]="'workouts.restSheet.apply' | translate"
  (save)="save()"
/>
