<ng-template #body>
  <ion-list lines="none">
    <ion-item class="head" lines="full">
      <ion-label class="ion-text-wrap">
        <h3>{{ name() }}</h3>
      </ion-label>
    </ion-item>

    @for (item of actions(); track item.id) {
      <ion-item
        button
        [detail]="false"
        [class.destructive]="item.destructive"
        (click)="choose(item.id)"
      >
        <ion-icon slot="start" [name]="item.icon" aria-hidden="true" />
        <ion-label>{{ item.label }}</ion-label>
      </ion-item>
    }
  </ion-list>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  title="Exercise actions"
  [body]="body"
  [showHeader]="false"
  [showFooter]="false"
  [flushBody]="true"
  [breakpoints]="[0, 0.45]"
  [initialBreakpoint]="0.45"
/>
