<ion-item
  class="mh-session-row mh-list-row"
  button
  detail="false"
  lines="none"
  [attr.data-tone]="tone()"
  (click)="select.emit()"
>
  <ion-label>
    <h2>{{ program().name }}</h2>
    <div class="tags">
      @if (isDraft()) {
        <ion-badge data-tone="medium">{{ 'enum.programStatus.DRAFT' | translate }}</ion-badge>
      }
      @if (isRoutine()) {
        <ion-badge data-tone="teal">{{ 'programs.row.routine' | translate }}</ion-badge>
      }
      <!-- Says whose it is. Without it a coach cannot tell a starter from
           their own work, which is the question this list kept raising. -->
      @if (isStarter()) {
        <ion-badge data-tone="info">MotionHive</ion-badge>
      }
      @if (meta()) {
        <ion-note>{{ meta() }}</ion-note>
      }
    </div>
  </ion-label>

  @if (trailing()) {
    <ion-note slot="end" class="trailing">{{ trailing() }}</ion-note>
  }
  <ion-icon slot="end" name="chevron-forward" color="medium" aria-hidden="true" />
</ion-item>
