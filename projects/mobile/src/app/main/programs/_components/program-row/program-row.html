<ion-item
  class="mh-session-row mh-list-row"
  button
  detail="false"
  lines="none"
  [attr.data-tone]="tone()"
  (click)="select.emit()"
>
  <ion-label>
    <h2>{{ program().name }}</h2>
    <div class="tags">
      @if (isDraft()) {
        <ion-badge data-tone="medium">Draft</ion-badge>
      }
      @if (isRoutine()) {
        <ion-badge data-tone="teal">Routine</ion-badge>
      }
      @if (meta()) {
        <ion-note>{{ meta() }}</ion-note>
      }
    </div>
  </ion-label>

  @if (trailing()) {
    <ion-note slot="end" class="trailing">{{ trailing() }}</ion-note>
  }
  <ion-icon slot="end" name="chevron-forward" color="medium" aria-hidden="true" />
</ion-item>
