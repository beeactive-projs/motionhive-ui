<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/programs" />
    </ion-buttons>
    <ion-title>Assignments</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content />
  </ion-refresher>

  @if (store.showError()) {
    <mh-empty-state
      icon="alert-circle-outline"
      heading="Couldn't load the assignments"
      message="Check your connection and try again."
      actionLabel="Try again"
      (action)="retry()"
    />
  } @else if (store.showSkeleton()) {
    <!-- Mirrors the row shape so nothing shifts when data lands. -->
    <div class="mh-page">
      <span class="mh-kicker meta">
        <ion-skeleton-text [animated]="true" style="width: 11rem; height: 0.75rem" />
      </span>
      <div>
        @for (_ of skeletonRows; track $index) {
          <ion-item lines="none" class="row-skeleton mh-list-row">
            <mh-hex-avatar slot="start" size="md" color="medium" tone="wash" />
            <ion-label>
              <h2><ion-skeleton-text [animated]="true" style="width: 40%" /></h2>
              <p><ion-skeleton-text [animated]="true" style="width: 60%" /></p>
            </ion-label>
          </ion-item>
        }
      </div>
    </div>
  } @else if (store.isEmpty()) {
    <mh-empty-state
      icon="people-outline"
      heading="Nobody on this yet"
      message="Assign it to a client and they will show up here."
      actionLabel="Assign to a client"
      (action)="openAssign()"
    />
  } @else {
    <div class="mh-page">
      <span class="mh-kicker meta">{{ store.subtitle() }}</span>
      <div>
        @for (row of store.rows(); track row.id) {
          <mh-assignment-row
            [assignment]="row"
            [busy]="store.isBusy(row.id)"
            (pause)="setStatus(row, Statuses.Paused)"
            (resume)="setStatus(row, Statuses.Active)"
          />
        }
      </div>
    </div>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button aria-label="Assign to a client" (click)="openAssign()">
      <ion-icon name="person-add-outline" aria-hidden="true" />
    </ion-fab-button>
  </ion-fab>
</ion-content>

<mh-assign-sheet [(open)]="assignOpen" [program]="store.program()" (assign)="onAssign($event)" />
