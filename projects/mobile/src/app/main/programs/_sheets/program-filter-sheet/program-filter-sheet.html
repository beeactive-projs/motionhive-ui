<ng-template #body>
  <div class="mh-section-label">{{ 'programs.filter.origin' | translate }}</div>
  <div class="mh-chip-cloud">
    @for (chip of originChips; track chip.value) {
      <ion-button
        class="chip"
        fill="clear"
        shape="round"
        size="small"
        [class.selected]="isOn(chip.value)"
        [attr.aria-pressed]="isOn(chip.value)"
        (click)="choose(chip.value)"
      >
        {{ chip.label | translate }}
        <span class="count">{{ countFor(chip.value) }}</span>
      </ion-button>
    }
  </div>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'programs.filter.title' | translate"
  [body]="body"
  [saveLabel]="'programs.filter.showResults' | translate"
  [breakpoints]="[0, 0.5, 0.95]"
  [initialBreakpoint]="0.5"
  (save)="commit()"
  (dismissed)="discard()"
/>
