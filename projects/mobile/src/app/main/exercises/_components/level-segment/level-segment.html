<ion-segment [attr.aria-label]="'exercises.fields.level' | translate" [value]="level()" (ionChange)="onChange($event.detail.value)">
  @for (option of levels; track option) {
    <ion-segment-button [value]="option">
      <ion-label>{{ levelLabel(option) }}</ion-label>
    </ion-segment-button>
  }
</ion-segment>
