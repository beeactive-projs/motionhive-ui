<ion-item lines="none" button [detail]="!isPicker()" [class.picked]="selected()"
  [attr.aria-pressed]="selected()" (click)="select.emit()">
  <!-- Decorative: the name it would announce is the very next thing in the row. -->
  <mh-hex-avatar slot="start" size="md" tone="wash" aria-hidden="true" [color]="kindTone()"
    [icon]="tileIcon()" [imageUrl]="thumbnailUrl()" />

  <ion-label>
    <h2>{{ name() }}</h2>
    @if (originalName(); as original) {
    <p class="original" lang="en">{{ original }}</p>
    }
    <p class="meta">
      @if (!isPicker()) {
      <ion-badge [attr.data-tone]="levelTone()">{{ levelLabel() }}</ion-badge>
      }
      <span>{{ subline() }}</span>
    </p>
  </ion-label>

  @if (isPicker()) {
  @if (selected()) {
  <ion-icon class="tick" slot="end" name="checkmark-circle" aria-hidden="true" />
  }
  } @else {
  @if (ownership(); as chip) {
  <div class="chips" slot="end">
    <ion-badge class="ownership" [attr.data-tone]="chip.tone">{{ chip.label }}</ion-badge>
  </div>
  }
  }
</ion-item>
