<ion-header [translucent]="true" class="bar">
  <ion-toolbar class="bar">
    <ion-buttons slot="start">
      <ion-button [attr.aria-label]="'a11y.closePhoto' | translate" (click)="close()">
        <ion-icon slot="icon-only" name="close-outline" />
      </ion-button>
    </ion-buttons>
    <ion-title>{{ counter() }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="stage">
  @if (error()) {
  <mh-empty-state icon="alert-circle-outline" [heading]="'groups.photos.loadError' | translate"
    [message]="'error.checkConnection' | translate" [actionLabel]="'button.tryAgain' | translate"
    (action)="retry()" />
  } @else if (loading()) {
  <div class="centre" aria-busy="true">
    <ion-spinner name="crescent" />
  </div>
  } @else if (current(); as url) {
  <div class="centre">
    <img [src]="url" [attr.alt]="'groups.photos.alt' | translate: { index: index() + 1, total: total() }" />
  </div>

  @if (total() > 1) {
  <!-- Arrows rather than a swipe: a swipe on a photo competes with Ionic's
       own back gesture, and losing the photo on a mis-swipe is worse than a
       pair of buttons. -->
  <div class="nav">
    <ion-button fill="clear" class="arrow" [disabled]="!hasPrevious()"
      [attr.aria-label]="'groups.photos.previous' | translate"
      (click)="previous()">
      <ion-icon slot="icon-only" name="chevron-back" />
    </ion-button>
    <ion-button fill="clear" class="arrow" [disabled]="!hasNext()"
      [attr.aria-label]="'groups.photos.next' | translate"
      (click)="next()">
      <ion-icon slot="icon-only" name="chevron-forward" />
    </ion-button>
  </div>
  }
  } @else {
  <mh-empty-state icon="image-outline" [heading]="'groups.photos.empty.title' | translate"
    [message]="'groups.photos.empty.message' | translate" />
  }
</ion-content>
