<div class="note">
  <div class="head">
    <span class="mark" aria-hidden="true">
      <svg [attr.viewBox]="hex.viewBox" [style.aspect-ratio]="hex.aspect">
        <path [attr.d]="hex.d" />
      </svg>
    </span>
    <span class="app">{{ 'common.appName' | translate }}</span>
    @if (sub()) {
      <span class="sub">· {{ sub() }}</span>
    }
  </div>

  <div class="body" [class.inline]="inline()">
    @if (title() || clock()) {
      <span class="title">{{ title() }}{{ clock() }}</span>
    }
    @if (text()) {
      <span class="text">{{ text() }}</span>
    }
  </div>

  @if (progress() !== null) {
    <span class="track"><span class="fill" [style.width.%]="(progress() ?? 0) * 100"></span></span>
  }

  @if (actions().length) {
    <div class="actions">
      @for (action of actions(); track $index) {
        <span class="action">{{ action }}</span>
      }
    </div>
  }
</div>
