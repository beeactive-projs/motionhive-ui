<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home/account" />
    </ion-buttons>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="portrait">
    <mh-hex-avatar size="2xl" [name]="store.fullName()" [imageUrl]="store.avatarUrl()" />
    <ion-button fill="clear" size="small" (click)="photoSheetOpen.set(true)">Edit photo</ion-button>
  </div>

  <ion-list [inset]="true" class="mh-card-list">
    <mh-settings-row
      label="Name"
      [value]="store.fullName() || null"
      valuePlaceholder="Not provided"
      (select)="nameSheetOpen.set(true)"
    />

    @if (isInstructor()) {
      <mh-settings-row
        label="About"
        [value]="aboutValue()"
        valuePlaceholder="Not provided"
        (select)="aboutSheetOpen.set(true)"
      />
    }

    <mh-settings-row
      label="Handle"
      [value]="handleValue()"
      valuePlaceholder="Not set"
      [valueMono]="true"
      (select)="handleSheetOpen.set(true)"
    />

    <mh-settings-row
      label="Phone"
      [value]="account()?.phone ?? null"
      valuePlaceholder="Not provided"
      (select)="phoneSheetOpen.set(true)"
    />

    <mh-settings-row
      label="Location"
      [value]="locationValue()"
      valuePlaceholder="Not provided"
      (select)="locationSheetOpen.set(true)"
    />

    @if (isInstructor()) {
      <mh-settings-row
        label="Links"
        [value]="linksValue()"
        valuePlaceholder="None added"
        (select)="linksSheetOpen.set(true)"
      />
    }
  </ion-list>

  <ion-note class="caption" color="medium">
    Your name, handle{{ isInstructor() ? ', about and links are' : ' and photo are' }} visible on
    your public profile. Phone and email stay private.
  </ion-note>

  <mh-photo-sheet [(open)]="photoSheetOpen" />
  <mh-name-sheet [(open)]="nameSheetOpen" />
  <mh-handle-sheet [(open)]="handleSheetOpen" />
  <mh-phone-sheet [(open)]="phoneSheetOpen" />
  <mh-location-sheet [(open)]="locationSheetOpen" />
  @if (isInstructor()) {
    <mh-about-sheet [(open)]="aboutSheetOpen" />
    <mh-links-sheet [(open)]="linksSheetOpen" />
  }
</ion-content>
