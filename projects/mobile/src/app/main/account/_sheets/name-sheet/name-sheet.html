<ng-template #body>
  <ion-input
    [label]="'form.label.firstName' | translate"
    labelPlacement="stacked"
    fill="outline"
    autocapitalize="words"
    [value]="firstName()"
    (ionInput)="firstName.set($event.detail.value ?? '')"
  />

  <ion-input
    class="ion-margin-top"
    [label]="'form.label.lastName' | translate"
    labelPlacement="stacked"
    fill="outline"
    autocapitalize="words"
    [value]="lastName()"
    (ionInput)="lastName.set($event.detail.value ?? '')"
  />

  <p class="mh-helper">{{ 'accountSheets.name.hint' | translate }}</p>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'form.label.name' | translate"
  [body]="body"
  [canSave]="canSave()"
  [saving]="saving()"
  [breakpoints]="[0, 0.5, 0.95]"
  [initialBreakpoint]="0.5"
  (save)="save()"
/>
