<ng-template #body>
  <ion-textarea
    [label]="'accountSheets.about.label' | translate"
    labelPlacement="stacked"
    fill="outline"
    [rows]="5"
    [autoGrow]="true"
    [counter]="true"
    [maxlength]="maxLength"
    [placeholder]="'accountSheets.about.placeholder' | translate"
    [value]="bio()"
    (ionInput)="bio.set($event.detail.value ?? '')"
  />

  <p class="mh-helper">{{ 'accountSheets.about.hint' | translate }}</p>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'accountSheets.about.title' | translate"
  [body]="body"
  [saving]="saving()"
  [breakpoints]="[0, 0.55, 0.95]"
  [initialBreakpoint]="0.55"
  (save)="save()"
/>
