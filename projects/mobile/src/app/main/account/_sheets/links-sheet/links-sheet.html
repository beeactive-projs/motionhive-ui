<ng-template #body>
  <mh-social-links-fields [(links)]="links" />

  <p class="mh-helper">{{ 'accountSheets.links.hint' | translate }}</p>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'accountSheets.links.title' | translate"
  [body]="body"
  [saving]="saving()"
  [breakpoints]="[0, 0.85, 0.95]"
  [initialBreakpoint]="0.85"
  (save)="save()"
/>
