<ng-template #body>
  <ion-select
    [label]="'form.label.country' | translate"
    labelPlacement="stacked"
    fill="outline"
    interface="modal"
    [value]="country()"
    (ionChange)="country.set($event.detail.value)"
  >
    @for (option of countries; track option.code) {
      <ion-select-option [value]="option.code">{{ option.label }}</ion-select-option>
    }
  </ion-select>

  <ion-input
    class="ion-margin-top"
    [label]="'accountSheets.phone.phoneNumber' | translate"
    labelPlacement="stacked"
    fill="outline"
    type="tel"
    inputmode="tel"
    [placeholder]="'accountSheets.phone.placeholder' | translate"
    [value]="nationalNumber()"
    [class.ion-invalid]="invalid()"
    [class.ion-touched]="invalid()"
    [errorText]="'accountSheets.phone.invalid' | translate"
    (ionInput)="onNumberInput($event.detail.value ?? '')"
  />

  <p class="mh-helper">{{ 'accountSheets.phone.hint' | translate }}</p>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'accountSheets.phone.phoneNumber' | translate"
  [body]="body"
  [canSave]="canSave()"
  [saving]="saving()"
  [breakpoints]="[0, 0.5, 0.95]"
  [initialBreakpoint]="0.5"
  (save)="save()"
/>
