<!-- Stays open while the picker is up: the file input has to be clicked inside
     the tap, and the upload closes the sheet when it lands. -->
<mh-action-sheet
  [(open)]="open"
  [title]="'accountSheets.photo.title' | translate"
  [actions]="actions"
  [closeOnChoose]="false"
  (chosen)="choose($event)"
/>

<input
  #cameraInput
  type="file"
  hidden
  [accept]="accept"
  capture="environment"
  (change)="onFileSelected($event)"
/>
<input #galleryInput type="file" hidden [accept]="accept" (change)="onFileSelected($event)" />
