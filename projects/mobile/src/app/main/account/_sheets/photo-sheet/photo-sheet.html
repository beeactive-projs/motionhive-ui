<ng-template #body>
  <ion-list [inset]="true" class="mh-card-list">
    <ion-item button [detail]="false" lines="full" (click)="takePhoto()">
      <ion-icon slot="start" name="camera-outline" aria-hidden="true" />
      <ion-label>Take photo</ion-label>
    </ion-item>
    <ion-item button [detail]="false" lines="full" (click)="choosePhoto()">
      <ion-icon slot="start" name="image-outline" aria-hidden="true" />
      <ion-label>Choose photo</ion-label>
    </ion-item>
    <!-- No DELETE avatar endpoint exists yet; disabled rather than absent so
         the capability reads as coming, not missing. -->
    <ion-item [detail]="false" [disabled]="true" lines="none">
      <ion-icon slot="start" name="trash-outline" color="danger" aria-hidden="true" />
      <ion-label color="danger">
        Remove photo
        <p>Coming soon</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  title="Edit profile picture"
  [body]="body"
  [showFooter]="false"
  [breakpoints]="[0, 0.42]"
  [initialBreakpoint]="0.42"
/>

<input
  #cameraInput
  type="file"
  hidden
  [accept]="accept"
  capture="environment"
  (change)="onFileSelected($event)"
/>
<input #galleryInput type="file" hidden [accept]="accept" (change)="onFileSelected($event)" />
