<ng-template #body>
  @if (url(); as link) {
    <ion-note class="subtitle">{{ 'accountSheets.share.subtitle' | translate }}</ion-note>

    <div class="link-box">
      <span class="link-text">{{ link }}</span>
      <ion-button size="small" (click)="copyLink()">{{ 'button.copy' | translate }}</ion-button>
    </div>

    <ion-list [inset]="true" class="mh-card-list">
      <ion-item button [detail]="false" (click)="share()">
        <mh-hex-avatar slot="start" size="sm" icon="share-social-outline" color="info" />
        <ion-label>{{ 'accountSheets.share.shareVia' | translate }}</ion-label>
      </ion-item>
      <ion-item button [detail]="false" (click)="openLink()">
        <mh-hex-avatar slot="start" size="sm" icon="open-outline" color="teal" />
        <ion-label>{{ 'accountSheets.share.openProfile' | translate }}</ion-label>
      </ion-item>
    </ion-list>
  } @else {
    <mh-empty-state
      icon="at-outline"
      [heading]="'accountSheets.share.empty.title' | translate"
      [message]="'accountSheets.share.empty.message' | translate"
    />
  }
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'accountSheets.share.title' | translate"
  [body]="body"
  [showFooter]="false"
  [breakpoints]="[0, 0.5]"
  [initialBreakpoint]="0.5"
/>
