<ng-template #body>
  <ion-input
    [label]="'form.label.handle' | translate"
    labelPlacement="stacked"
    fill="outline"
    autocapitalize="off"
    autocorrect="off"
    spellcheck="false"
    [maxlength]="maxLength"
    [value]="handle()"
    [class.ion-invalid]="validationError() !== null"
    [class.ion-touched]="validationError() !== null"
    [errorText]="validationError() ?? ''"
    (ionInput)="handle.set($event.detail.value ?? '')"
  >
    <span slot="start" class="prefix">&#64;</span>
  </ion-input>

  <ion-note class="preview">{{ preview() }}</ion-note>

  <p class="mh-helper">{{ 'accountSheets.handle.hint' | translate }}</p>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'accountSheets.handle.title' | translate"
  [body]="body"
  [canSave]="canSave()"
  [saving]="saving()"
  [breakpoints]="[0, 0.5, 0.95]"
  [initialBreakpoint]="0.5"
  (save)="save()"
/>
