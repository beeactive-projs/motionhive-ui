<ng-template #body>
  <ion-input
    [label]="'form.label.displayName' | translate"
    labelPlacement="stacked"
    fill="outline"
    [maxlength]="displayNameMaxLength"
    [value]="displayName()"
    (ionInput)="displayName.set($event.detail.value ?? '')"
  />

  <ion-input
    class="field"
    [label]="'form.label.yearsOfExperience' | translate"
    labelPlacement="stacked"
    fill="outline"
    type="number"
    inputmode="numeric"
    [min]="0"
    [max]="maxYears"
    [value]="yearsOfExperience()"
    (ionInput)="yearsOfExperience.set($event.detail.value ? +$event.detail.value : null)"
  />

  <ion-textarea
    class="field"
    [label]="'form.label.bio' | translate"
    labelPlacement="stacked"
    fill="outline"
    [rows]="4"
    [autoGrow]="true"
    [maxlength]="bioMaxLength"
    [value]="bio()"
    (ionInput)="bio.set($event.detail.value ?? '')"
  />

  <ion-input
    class="field"
    [label]="'form.label.specializations' | translate"
    labelPlacement="stacked"
    fill="outline"
    placeholder="strength_training, hiit, yoga"
    [value]="specializations()"
    (ionInput)="specializations.set($event.detail.value ?? '')"
  />
  <p class="mh-helper">{{ 'accountSheets.coaching.specializationsHint' | translate }}</p>

  <ion-list [inset]="true" class="mh-card-list field">
    <ion-item lines="full">
      <ion-toggle
        [checked]="isAcceptingClients()"
        (ionChange)="isAcceptingClients.set($event.detail.checked)"
      >
        <ion-label class="ion-text-wrap">
          {{ 'accountSheets.coaching.accepting' | translate }}
          <p>{{ 'accountSheets.coaching.acceptingHint' | translate }}</p>
        </ion-label>
      </ion-toggle>
    </ion-item>
    <ion-item lines="none">
      <ion-toggle
        [checked]="showSocialLinks()"
        (ionChange)="showSocialLinks.set($event.detail.checked)"
      >
        <ion-label class="ion-text-wrap">
          {{ 'accountSheets.coaching.showSocialLinks' | translate }}
          <p>{{ 'accountSheets.coaching.showSocialLinksHint' | translate }}</p>
        </ion-label>
      </ion-toggle>
    </ion-item>
  </ion-list>

  <div class="field">
    <mh-social-links-fields [(links)]="links" />
  </div>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'accountSheets.coaching.title' | translate"
  [body]="body"
  [canSave]="canSave()"
  [saving]="saving()"
  [breakpoints]="[0, 0.9, 0.95]"
  [initialBreakpoint]="0.9"
  (save)="save()"
/>
