<ng-template #body>
  <ion-textarea
    fill="outline"
    [autoGrow]="true"
    [rows]="4"
    [maxlength]="1000"
    [counter]="true"
    [placeholder]="'sessions.noteSheet.placeholder' | translate"
    [value]="draft()"
    (ionInput)="draft.set($event.detail.value ?? '')"
  />

  <p class="mh-helper">{{ 'sessions.noteSheet.helper' | translate }}</p>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="title()"
  [saveLabel]="'sessions.noteSheet.save' | translate"
  [body]="body"
  [saving]="saving()"
  [breakpoints]="[0, 0.6]"
  [initialBreakpoint]="0.6"
  (save)="commit()"
/>
