<ng-template #body>
  <div class="mh-section-label">{{ 'sessions.capacitySheet.spots' | translate }}</div>
  <ion-input
    fill="outline"
    type="number"
    inputmode="numeric"
    [attr.aria-label]="'sessions.capacitySheet.spots' | translate"
    [min]="floor()"
    [max]="max"
    [value]="value()"
    (ionInput)="setValue($event.detail.value)"
  />

  @if (error(); as message) {
    <p class="mh-helper error">{{ message }}</p>
  }

  @if (suggestion(); as target) {
    <ion-note class="mh-note-block">
      <button type="button" class="suggestion" (click)="applySuggestion()">
        {{ 'sessions.capacitySheet.suggestion' | translate: { count: target } }}
      </button>
    </ion-note>
  }

  <p class="mh-helper">{{ 'sessions.capacitySheet.helper' | translate }}</p>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'sessions.capacitySheet.title' | translate"
  [saveLabel]="'sessions.capacitySheet.save' | translate"
  [body]="body"
  [canSave]="canSave()"
  [saving]="saving()"
  [breakpoints]="[0, 0.6]"
  [initialBreakpoint]="0.6"
  (save)="save()"
/>
