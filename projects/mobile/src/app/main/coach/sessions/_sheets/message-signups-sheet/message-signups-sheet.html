<ng-template #body>
  <ion-note class="mh-note-block">
    {{ recipientNote() ?? ('sessions.messageSheet.recipients.all' | translate) }}
  </ion-note>

  <ion-textarea
    fill="outline"
    [autoGrow]="true"
    [rows]="4"
    [maxlength]="2000"
    [counter]="true"
    [placeholder]="'sessions.messageSheet.placeholder' | translate"
    [value]="message()"
    (ionInput)="message.set($event.detail.value ?? '')"
  />

  <div class="mh-section-label">{{ 'sessions.messageSheet.quickFills' | translate }}</div>
  <div class="suggestions">
    @for (suggestion of suggestions; track suggestion) {
      <button type="button" class="suggestion" (click)="use(suggestion)">
        {{ suggestion | translate }}
      </button>
    }
  </div>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="'sessions.messageSheet.title' | translate"
  [saveLabel]="'button.send' | translate"
  [body]="body"
  [canSave]="canSend()"
  [saving]="sending()"
  [breakpoints]="[0, 0.7]"
  [initialBreakpoint]="0.7"
  (save)="send()"
/>
