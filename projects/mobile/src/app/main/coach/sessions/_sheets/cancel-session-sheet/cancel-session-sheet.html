<ng-template #body>
  @if (isRecurring()) {
  <ion-note class="mh-note-block">{{ 'sessions.cancelSheet.recurringNote' | translate }}</ion-note>

  <ion-radio-group [value]="scope()" (ionChange)="scope.set($event.detail.value)">
    @for (option of scopeOptions(); track option.value) {
    <ion-item lines="none" class="option" [class.selected]="scope() === option.value">
      <ion-radio [value]="option.value" justify="start" labelPlacement="end">
        <ion-label>
          <h3>{{ option.label }}</h3>
          <p>{{ option.detail }}</p>
        </ion-label>
      </ion-radio>
    </ion-item>
    }
  </ion-radio-group>
  }

  <div class="mh-section-label">{{ messageLabel() }}</div>

  <ion-textarea fill="outline" [autoGrow]="true" [rows]="3" [maxlength]="500"
    [placeholder]="'sessions.cancelSheet.placeholder' | translate" [value]="message()"
    (ionInput)="message.set($event.detail.value ?? '')" />

  <p class="mh-helper">{{ 'sessions.cancelSheet.helper' | translate }}</p>
</ng-template>

<mh-sheet-shell [(open)]="open" [title]="'sessions.cancelSheet.title' | translate" [subtitle]="subtitle()"
  [saveLabel]="'sessions.cancelSheet.confirm' | translate" saveColor="danger"
  [dismissLabel]="'button.keep' | translate" [body]="body" [saving]="saving()" [breakpoints]="[0, 0.75]"
  [initialBreakpoint]="0.75" (save)="confirm()" />
