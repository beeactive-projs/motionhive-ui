<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/messages" />
    </ion-buttons>
    <ion-title>Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="mh-page">
    <div class="hero">
      <mh-hex-avatar
        size="2xl"
        aria-hidden="true"
        [name]="name()"
        [imageUrl]="avatarUrl()"
        [color]="tone()"
      />
      <h1>{{ name() }}</h1>
      @if (handle(); as tag) {
        <ion-note class="handle">&#64;{{ tag }}</ion-note>
      }
    </div>

    @if (handle()) {
      <ion-list [inset]="true" class="mh-card-list">
        <mh-settings-row label="View profile" icon="person-outline" (select)="openProfile()" />
      </ion-list>
    }

    <section class="mh-section">
      <div class="mh-section-label">Conversation</div>
      <ion-list [inset]="true" class="mh-card-list">
        <ion-item lines="none">
          <ion-toggle
            justify="space-between"
            [checked]="muted()"
            [disabled]="muting() || !conversation()"
            (ionChange)="toggleMute()"
          >
            <ion-label>
              <h3>Mute notifications</h3>
              <p>You'll still see the unread badge.</p>
            </ion-label>
          </ion-toggle>
        </ion-item>
      </ion-list>
    </section>

    <section class="mh-section">
      <div class="mh-section-label">Privacy</div>
      <ion-list [inset]="true" class="mh-card-list">
        <mh-settings-row
          label="Block {{ name() }}"
          icon="ban-outline"
          iconColor="danger"
          [disabled]="!conversation()"
          (select)="blockOpen.set(true)"
        />
      </ion-list>
    </section>

    <ion-note class="mh-note-block ion-text-center">
      Blocking stops messages both ways.<br />
      Manage blocked people in Account → Blocked users.
    </ion-note>
  </div>
</ion-content>

<mh-block-user-sheet [(open)]="blockOpen" [name]="name()" (confirm)="block($event)" />
