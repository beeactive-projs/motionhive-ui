<ion-item
  class="mh-session-row mh-list-row"
  button
  detail="false"
  lines="none"
  [attr.data-tone]="tone()"
  (click)="select.emit()"
>
  <!-- Decorative: the name it would announce is the very next thing in the row. -->
  <mh-hex-avatar
    slot="start"
    size="md"
    aria-hidden="true"
    [name]="client().name"
    [imageUrl]="client().avatarUrl"
    [color]="avatarTone()"
  />

  <ion-label>
    <!-- h3: the "This week" kicker above this list is its h2. -->
    <h3>{{ client().name }}</h3>
    <p class="reason">{{ reason() }}</p>
  </ion-label>

  <div class="stat" slot="end">
    <span class="value">{{ stat().value }}</span>
    <span class="sub">{{ stat().sub }}</span>
  </div>

  <ion-icon slot="end" name="chevron-forward" color="medium" aria-hidden="true" />
</ion-item>
