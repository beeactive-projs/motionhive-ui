<ng-template #body>
  <ion-textarea
    fill="outline"
    [autoGrow]="true"
    [rows]="5"
    [maxlength]="maxLength"
    [counter]="showCounter()"
    [placeholder]="'clients.notesSheet.placeholder' | translate"
    [value]="draft()"
    (ionInput)="draft.set($event.detail.value ?? '')"
  />

  <p class="mh-helper">{{ 'clients.notesSheet.helper' | translate }}</p>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="title()"
  [saveLabel]="'clients.notesSheet.save' | translate"
  [dismissLabel]="'button.cancel' | translate"
  [body]="body"
  [canSave]="canSave()"
  [saving]="saving()"
  [breakpoints]="[0, 0.6]"
  [initialBreakpoint]="0.6"
  (save)="commit()"
/>
