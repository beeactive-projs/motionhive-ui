<ng-template #body>
  <ion-textarea
    fill="outline"
    [autoGrow]="true"
    [rows]="5"
    [maxlength]="maxLength"
    [counter]="showCounter()"
    placeholder="Goals, injuries, what keeps them motivated…"
    [value]="draft()"
    (ionInput)="draft.set($event.detail.value ?? '')"
  />

  <p class="mh-helper">Only you can see this. It stays with this client.</p>
</ng-template>

<mh-sheet-shell
  [(open)]="open"
  [title]="title()"
  saveLabel="Save note"
  [body]="body"
  [canSave]="canSave()"
  [saving]="saving()"
  [breakpoints]="[0, 0.6]"
  [initialBreakpoint]="0.6"
  (save)="commit()"
/>
