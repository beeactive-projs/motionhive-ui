<!--
  Logo · role pill · search, bell, avatar. The pill pushes the switch-role
  page rather than toggling in place, so the choice is made on a screen that
  can explain what changes; the menu and account pages carry rows to the
  same page. Search is Discover's, opened in Home's stack.
-->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <mh-logo />

      @if (canSwitchMode()) {
        <ion-button
          class="role-pill"
          fill="clear"
          shape="round"
          [attr.aria-label]="'home.switchRoleLabel' | translate: { role: role().label }"
          (click)="openRoleSwitch()"
        >
          <!-- Decorative: the button's label already names the role. -->
          <mh-hex-avatar slot="start" size="xs" [icon]="role().icon" [color]="role().color" />
          <span class="role-label">{{ role().label }}</span>
          <ion-icon slot="end" name="chevron-down-outline" aria-hidden="true" />
        </ion-button>
      }
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button [attr.aria-label]="'home.search' | translate" (click)="openSearch()">
        <ion-icon slot="icon-only" name="search-outline" aria-hidden="true" />
      </ion-button>
      <mh-notification-bell />
      <mh-avatar-button />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!--
  The greeting lives in the body rather than a `collapse="condense"` large
  title: condensed headers are iOS-only, so on Android the heading would
  silently disappear.
-->
<ion-content [fullscreen]="true" class="mh-flat-page">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content />
  </ion-refresher>

  <!--
    Which body to render is a question about roles, so nothing renders until
    the session says which roles this account holds. Guessing would flash the
    trainee home at a coach on every cold start.
  -->
  @if (!roleKnown()) {
    <!-- Both bodies open the same way: a greeting, then the hive card. -->
    <div class="body-skeleton">
      <div>
        <ion-skeleton-text [animated]="true" style="width: 6.875rem; height: 0.5rem" />
        <ion-skeleton-text [animated]="true" style="width: 12.5rem; height: 1.5rem" />
      </div>
      <ion-skeleton-text class="card-skeleton" />
    </div>
  } @else if (mode() === NavModes.Coach) {
    <mh-coach-home />
  } @else {
    <mh-train-home />
  }
</ion-content>
