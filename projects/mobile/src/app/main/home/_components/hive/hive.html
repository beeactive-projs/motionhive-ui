<!-- Shared by every cell: the honey's gradient and the hexagon to clip it
     to. Each cell's svg has the same viewBox, so one clip fits them all. -->
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient [attr.id]="honeyId" x1="0" y1="0" x2="0" y2="1">
      <stop class="honey-top" offset="0" />
      <stop class="honey-base" offset="0.12" />
      <stop class="honey-base" offset="1" />
    </linearGradient>
    <clipPath [attr.id]="clipId">
      <path [attr.d]="hex().d" />
    </clipPath>
  </defs>
</svg>

@for (cell of cells(); track cell.key; let i = $index) {
  <div
    class="cell"
    aria-hidden="true"
    [attr.data-kind]="cell.kind"
    [attr.data-ring]="cell.ring"
    [attr.data-fill]="cell.fill"
    [style.--x]="cell.x"
    [style.--y]="cell.y"
    [style.--i]="i"
  >
    <svg [attr.viewBox]="hex().viewBox" preserveAspectRatio="xMidYMid meet">
      <path class="base" [attr.d]="hex().d" />
      @if (cell.fill) {
        <g [attr.clip-path]="clipUrl">
          <rect
            class="honey"
            x="0"
            y="0"
            width="100"
            height="100"
            [attr.fill]="cell.fill === Fills.Honey ? honeyUrl : null"
          />
        </g>
      }
      @if (cell.ring || cell.kind === Kinds.Centre) {
        <path class="ring" [attr.d]="hex().d" />
      }
    </svg>
    <!-- The first load's honey, in its own box so its halo (a CSS filter)
         follows the honey without blurring the cell under it. The cell's
         own hexagon, grown from its centre: it never leaves the cell, so
         it needs no clip (a clip did not hold over an animated layer in
         WebKit). -->
    @if (building()) {
      <span class="glow">
        <svg [attr.viewBox]="hex().viewBox" preserveAspectRatio="xMidYMid meet">
          <path #glow class="glow-honey" [attr.d]="hex().d" />
        </svg>
      </span>
    }
    @if (cell.label) {
      <span class="label">{{ cell.label }}</span>
    }
    @if (cell.dot) {
      <span class="dot"><ion-icon name="trophy" aria-hidden="true" /></span>
    }
  </div>
}
