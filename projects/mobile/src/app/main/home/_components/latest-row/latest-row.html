<ion-item button detail="false" (click)="select.emit()">
  <mh-hex-avatar
    slot="start"
    size="lg"
    aria-hidden="true"
    [name]="row().avatar.name"
    [imageUrl]="row().avatar.imageUrl"
    [icon]="row().avatar.icon"
    [color]="row().avatar.color"
    [tone]="row().avatar.wash ? 'wash' : 'base'"
  />
  <ion-label>
    <div class="mh-row-line title-line">
      <h2>{{ row().title }}</h2>
      <ion-note>{{ row().note }}</ion-note>
    </div>
    <!-- One line: the words give way, a count or a length stays whole. -->
    <p class="parts">
      @for (part of row().parts; track $index) {
        @if (!$first) {
          <span class="dot" aria-hidden="true">·</span>
        }
        <span class="part" [class.whole]="part.whole" [class.accent]="part.accent">
          {{ part.text }}
        </span>
      }
    </p>
  </ion-label>
</ion-item>
