@for (item of items(); track item.swatch) {
  <span class="item">
    @if (item.swatch === Swatches.Dot) {
      <span class="dot"></span>
    } @else {
      <svg class="swatch" [attr.data-swatch]="item.swatch" [attr.viewBox]="hex().viewBox">
        <path [attr.d]="hex().d" />
      </svg>
    }
    {{ item.label }}
  </span>
}
