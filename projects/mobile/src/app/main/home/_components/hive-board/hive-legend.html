@for (item of items(); track item.swatch) {
  <span class="item">
    @if (item.swatch === Swatches.Dot) {
      <span class="dot"></span>
    } @else {
      <svg class="swatch" [attr.data-swatch]="item.swatch" viewBox="6.7 0 86.6 100">
        <path [attr.d]="path" transform="rotate(90 50 50)" />
      </svg>
    }
    {{ item.label }}
  </span>
}
