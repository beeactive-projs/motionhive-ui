<ion-item
  class="mh-session-row mh-list-row"
  button
  detail="false"
  lines="none"
  [attr.data-tone]="tone()"
  (click)="select.emit()"
>
  <div class="when" slot="start">
    <span class="time">{{ time() }}</span>
    @if (duration()) {
      <span class="duration">{{ duration() }}</span>
    }
  </div>

  <ion-label>
    <h2>{{ title() }}</h2>
    <div class="tags">
      @if (isOnline()) {
        <ion-icon class="online" name="videocam-outline" aria-hidden="true" />
      }
      <ion-note>{{ meta() }}</ion-note>
      @if (booked()) {
        <ion-badge data-tone="success">Booked</ion-badge>
      }
    </div>
    @if (chip(); as chip) {
      <div class="tags">
        <ion-badge [attr.data-tone]="chip.tone">{{ chip.label }}</ion-badge>
      </div>
    } @else if (spots(); as spots) {
      <p class="spots">{{ spots }}</p>
    }
  </ion-label>

  <div class="price" slot="end">
    @if (isFree()) {
      <span class="amount free">Free</span>
    } @else {
      <span class="amount">{{ priceAmount() }}</span>
      <span class="currency">{{ priceCurrency() }}</span>
    }
  </div>
</ion-item>
