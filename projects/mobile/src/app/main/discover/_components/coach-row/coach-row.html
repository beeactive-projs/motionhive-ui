<!-- A flat-list row (ion-list.css): the avatar, the name on its own line,
     then what they coach with the one badge trailing it (Your coach, Request
     sent, Online or Taking clients), where WhatsApp keeps a row's badges. The
     name keeps the width: in Romanian the badge beside it would leave it four
     letters. In search, the part that matched is marked. A coach with no public profile has
     nowhere to open, so the row stays inert rather than pretending. -->
<ion-item [button]="hasProfile()" detail="false" (click)="onSelect()">
  <mh-hex-avatar
    slot="start"
    size="lg"
    aria-hidden="true"
    [name]="name()"
    [imageUrl]="coach().avatarUrl"
    [color]="tone()"
  />
  <ion-label>
    <h2><mh-highlight [text]="name()" [term]="highlight()" /></h2>
    <div class="mh-row-line">
      <p><mh-highlight [text]="subline()" [term]="highlight()" /></p>
      @if (badge(); as badge) {
        <ion-badge [attr.data-tone]="badge.tone">{{ badge.label }}</ion-badge>
      }
    </div>
  </ion-label>
</ion-item>
