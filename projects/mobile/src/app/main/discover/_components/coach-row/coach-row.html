<!-- A flat-list row (ion-list.css): the avatar, the name on its own line,
     then the city and specializations with the "Taking clients" badge
     trailing them, where WhatsApp keeps a row's badges. The name keeps the
     width: in Romanian the badge alone would leave it four letters. A coach
     with no public profile has nowhere to open, so the row stays inert
     rather than pretending. -->
<ion-item [button]="hasProfile()" detail="false" (click)="onSelect()">
  <mh-hex-avatar
    slot="start"
    size="lg"
    aria-hidden="true"
    [name]="name()"
    [imageUrl]="coach().avatarUrl"
    [color]="tone()"
  />
  <ion-label>
    <h2>{{ name() }}</h2>
    <div class="mh-row-line">
      <p>{{ subline() }}</p>
      @if (coach().isAcceptingClients) {
        <ion-badge data-tone="success">{{ 'discover.coachRow.takingClients' | translate }}</ion-badge>
      }
    </div>
  </ion-label>
</ion-item>
