<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Menu</ion-title>
    <ion-buttons slot="end">
      <mh-notification-bell />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="mh-page">
    <!-- Identity leads, the way Messenger opens its menu: who you are, then
         the way into the account area. -->
    <ion-list [inset]="true" class="mh-card-list">
      <ion-item button [detail]="true" lines="none" (click)="openAccount()">
        <mh-hex-avatar
          slot="start"
          size="md"
          [name]="userName()"
          [imageUrl]="user()?.avatarUrl ?? null"
        />
        <ion-label>
          <h2>{{ userName() }}</h2>
          <p>{{ user()?.email }}</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- The same door as the home pill: who you're working as, switched on a
         page that can explain what changes. Its own card — a settings-row
         cannot share a list with the bare identity item (hairline rules). -->
    @if (canSwitchRole()) {
      <ion-list [inset]="true" class="mh-card-list">
        <mh-settings-row
          label="Switch role"
          icon="swap-horizontal-outline"
          iconColor="medium"
          [value]="roleLabel()"
          (select)="openSwitchRole()"
        />
      </ion-list>
    }

    <!-- Grouped by intent, mirroring web's rail: the mode's workspace first,
         then the shared destinations. -->
    @for (section of sections(); track $index) {
      <section class="mh-section">
        @if (section.label) {
          <ion-note class="mh-kicker" color="medium">{{ section.label }}</ion-note>
        }
        <ion-list [inset]="true" class="mh-card-list">
          @for (entry of section.items; track entry.route) {
            <mh-settings-row
              [label]="entry.label"
              [icon]="entry.icon"
              [iconColor]="entry.iconColor"
              [dot]="entry.dot?.() ?? false"
              (select)="open(entry)"
            />
          }
        </ion-list>
      </section>
    }
  </div>
</ion-content>
