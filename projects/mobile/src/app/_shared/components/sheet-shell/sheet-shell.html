<ion-modal [isOpen]="open()" [breakpoints]="breakpoints()" [initialBreakpoint]="initialBreakpoint()" [handle]="true"
  [expandToScroll]="false" [attr.aria-label]="title()" (didDismiss)="open.set(false)">
  <!-- Everything the modal shows must live inside this template: Ionic moves
       the modal when it presents, and anything outside is left behind. -->
  <ng-template>
    @if (showHeader()) {
    <ion-header class="ion-no-border">
      <ion-toolbar>
        @if (subtitle() || actionLabel()) {
        <div class="heading">
          <span class="heading-title">{{ title() }}</span>
          @if (subtitle()) {
          <span class="heading-subtitle">{{ subtitle() }}</span>
          }
        </div>
        <ion-buttons slot="end">
          @if (actionLabel()) {
          <ion-button fill="clear" class="header-action" [disabled]="actionDisabled()" (click)="action.emit()">
            {{ actionLabel() }}
          </ion-button>
          }
          @if (subtitle()) {
          <ion-button class="close" shape="round" aria-label="Close" (click)="dismiss()">
            <ion-icon slot="icon-only" name="close" />
          </ion-button>
          }
        </ion-buttons>
        } @else {
        <div class="heading">
          <span class="heading-title">{{ title() }}</span>
        </div>
        <ion-buttons slot="end">
          <ion-button class="close" shape="round" aria-label="Close" (click)="dismiss()">
            <ion-icon slot="icon-only" name="close" />
          </ion-button>
        </ion-buttons>
        }
      </ion-toolbar>
    </ion-header>
    }

    <ion-content class="ion-padding" [class.flush]="flushBody()">
      <ng-container [ngTemplateOutlet]="body()" />
    </ion-content>

    @if (showFooter()) {
    <ion-footer class="ion-no-border">
      <ion-toolbar>
        <!-- Not `ion-buttons`: that slot packs its children to one edge at
               toolbar-button size. The sheet's commit is a full-width bar. -->
        <div class="actions">
          <ion-button fill="outline" color="medium" class="dismiss" [disabled]="saving()" (click)="dismiss()">
            {{ dismissLabel() }}
          </ion-button>
          <ion-button fill="solid" class="confirm" [color]="saveColor()" [disabled]="!canSave() || saving()"
            (click)="save.emit()">
            @if (saving()) {
            <ion-spinner name="crescent" />
            } @else {
            {{ saveLabel() }}
            }
          </ion-button>
        </div>
      </ion-toolbar>
    </ion-footer>
    }
  </ng-template>
</ion-modal>
