<ion-modal
  [isOpen]="open()"
  [breakpoints]="breakpoints()"
  [initialBreakpoint]="initialBreakpoint()"
  [handle]="true"
  [expandToScroll]="false"
  (didDismiss)="open.set(false)"
>
  <!-- Everything the modal shows must live inside this template: Ionic moves
       the modal when it presents, and anything outside is left behind. -->
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-title>{{ title() }}</ion-title>
        <ion-buttons slot="end">
          <ion-button aria-label="Close" (click)="dismiss()">
            <ion-icon slot="icon-only" name="close" />
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ng-container [ngTemplateOutlet]="body()" />
    </ion-content>

    @if (showFooter()) {
      <ion-footer class="ion-no-border">
        <ion-toolbar>
          <ion-buttons slot="end">
            <ion-button fill="clear" color="medium" [disabled]="saving()" (click)="dismiss()">
              {{ cancelLabel() }}
            </ion-button>
            <ion-button
              fill="solid"
              [color]="saveColor()"
              [disabled]="!canSave() || saving()"
              (click)="save.emit()"
            >
              @if (saving()) {
                <ion-spinner name="crescent" />
              } @else {
                {{ saveLabel() }}
              }
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-footer>
    }
  </ng-template>
</ion-modal>
