@if (current(); as item) {
  <div #banner class="banner" role="status" [class.settling]="settling()">
    <ion-button class="body" fill="clear" (click)="open()">
      <mh-hex-avatar
        slot="start"
        size="sm"
        tone="wash"
        aria-hidden="true"
        [icon]="style()?.icon ?? 'notifications-outline'"
        [color]="style()?.color ?? 'medium'"
      />
      <span class="text">
        <span class="title">{{ item.title }}</span>
        <span class="detail">{{ item.body }}</span>
      </span>
    </ion-button>

    <ion-button class="close" fill="clear" shape="round" aria-label="Dismiss" (click)="dismiss()">
      <ion-icon slot="icon-only" name="close-outline" />
    </ion-button>
  </div>
}
