@if (view(); as item) {
  <div #banner class="banner" role="status" [class.settling]="settling()">
    <ion-button class="body" fill="clear" (click)="open()">
      <!-- A person's photo for a message; the category's tile otherwise. -->
      @if (item.name) {
        <mh-hex-avatar
          slot="start"
          size="sm"
          aria-hidden="true"
          [name]="item.name"
          [imageUrl]="item.imageUrl"
          [color]="item.color"
        />
      } @else {
        <mh-hex-avatar
          slot="start"
          size="sm"
          tone="wash"
          aria-hidden="true"
          [icon]="item.icon"
          [color]="item.color"
        />
      }
      <span class="text">
        <span class="title">{{ item.title }}</span>
        <span class="detail">{{ item.detail }}</span>
      </span>
    </ion-button>

    <ion-button class="close" fill="clear" shape="round" [attr.aria-label]="'button.dismiss' | translate" (click)="dismiss()">
      <ion-icon slot="icon-only" name="close-outline" />
    </ion-button>
  </div>
}
