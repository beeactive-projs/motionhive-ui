<!-- The frame is the classic tile's box in both shapes; the hexagon (the
     avatar's `shape`) fills the 100 square around it, so the logo's points
     reach past the frame, above and below. -->
<svg
  class="hex"
  [attr.viewBox]="frame.viewBox"
  preserveAspectRatio="xMidYMid meet"
  aria-hidden="true"
>
  <!-- The filled shape is always drawn, and the image rides on top of it. A
       photo that 404s or has not decoded yet would otherwise leave a hole
       where the avatar should be — this way it degrades to the tinted
       hexagon, which is what an avatar without a picture looks like anyway. -->
  <path [attr.d]="hex().d" />
  @if (showImage()) {
    <defs>
      <clipPath [attr.id]="clipId">
        <path [attr.d]="hex().d" />
      </clipPath>
    </defs>
    <image
      [attr.href]="imageUrl()"
      x="0"
      y="0"
      width="100"
      height="100"
      preserveAspectRatio="xMidYMid slice"
      [attr.clip-path]="clipUrl"
    />
  }
</svg>

@if (icon(); as glyph) {
  <span class="hex-content">
    <ion-icon [name]="glyph" aria-hidden="true" />
  </span>
} @else if (!showImage() && initials()) {
  <span class="hex-content" aria-hidden="true">{{ initials() }}</span>
}

@if (name()) {
  <span class="mh-visually-hidden">{{ name() }}</span>
}
