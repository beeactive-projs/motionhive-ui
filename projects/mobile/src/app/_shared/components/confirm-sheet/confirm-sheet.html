<ng-template #sheetBody>
  <div class="mh-stack">
    <p class="lead">{{ body() }}</p>

    @if (facts().length > 0) {
      <dl class="facts">
        @for (fact of facts(); track fact.label) {
          <div>
            <dt>{{ fact.label }}</dt>
            <dd>{{ fact.value }}</dd>
          </div>
        }
      </dl>
    }

    @if (irreversible(); as note) {
      <!-- Named, not hidden: the point is that they know before, not after. -->
      <div class="irreversible">
        <ion-icon name="alert-circle-outline" aria-hidden="true" />
        <span>{{ note }}</span>
      </div>
    }

    @if (blockedReason(); as reason) {
      <ion-note class="blocked">{{ reason }}</ion-note>
    }
  </div>
</ng-template>

<!-- As tall as what it says: a sentence and two buttons, not a half-empty
     sheet. A long one scrolls inside the sheet (the shell's `fit`). -->
<mh-sheet-shell
  [(open)]="open"
  [title]="title()"
  [body]="sheetBody"
  [fit]="true"
  [saveLabel]="confirmLabel() || ('button.confirm' | translate)"
  [dismissLabel]="cancelLabel()"
  [saveColor]="tone()"
  [canSave]="!blockedReason()"
  [saving]="saving()"
  (save)="confirm.emit()"
/>
