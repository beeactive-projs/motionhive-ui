<ion-input fill="outline" labelPlacement="stacked" [type]="revealed() ? 'text' : 'password'" [label]="label()"
  [id]="inputId()" [value]="value()" [disabled]="disabled()" [placeholder]="placeholder()"
  [autocomplete]="autocomplete()" [enterkeyhint]="enterkeyhint()" (ionInput)="value.set($event.detail.value ?? '')"
  (ionBlur)="touch.emit()">
  <!-- Not ion-input-password-toggle: its aria-label is hardcoded English. -->
  <!-- pointerdown is cancelled so a tap doesn't blur the field (as Ionic's toggle does). -->
  <ion-button slot="end" fill="clear" shape="round" type="button" [disabled]="disabled()"
    [attr.aria-label]="(revealed() ? 'a11y.hidePassword' : 'a11y.showPassword') | translate"
    [attr.aria-pressed]="revealed()" (pointerdown)="$event.preventDefault()" (click)="toggleRevealed()">
    <ion-icon slot="icon-only" [name]="revealed() ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true" />
  </ion-button>
</ion-input>

@if (showRequirements()) {
<ul class="rules" [attr.aria-label]="'form.hint.passwordRules' | translate">
  @for (rule of rules(); track rule.labelKey) {
  <li>
    <ion-badge [attr.data-tone]="rule.tone" aria-hidden="true">
      <ion-icon [name]="rule.met ? 'checkmark-circle' : 'ellipse-outline'" />
      {{ rule.labelKey | translate }}
    </ion-badge>
    <span class="mh-visually-hidden">
      {{ (rule.met ? 'a11y.requirementMet' : 'a11y.requirementNotMet') | translate: { label: (rule.labelKey | translate) } }}
    </span>
  </li>
  }
</ul>
}
