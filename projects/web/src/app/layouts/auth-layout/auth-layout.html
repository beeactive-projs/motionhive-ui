<mh-site-header />

<main class="auth-main relative">
  <div class="honeycomb" aria-hidden="true"></div>

  <div class="relative mx-auto grid min-h-[calc(100dvh-4.4rem)] max-w-285 items-center gap-16 px-4 py-6 sm:px-7 sm:py-16
    lg:grid-cols-[minmax(0,1fr)_30rem]">
    @if (hero(); as hero) {
    <section class="hidden lg:block">
      <mh-kicker tone="teal">{{ 'auth.layout.kicker' | translate }}</mh-kicker>
      <p class="hero-title mt-4 font-heading font-extrabold">
        {{ hero.line1 | translate }}<br>
        @if (hero.line2) { {{ hero.line2 | translate }} }
        <span class="text-brand">{{ hero.highlight | translate }}</span>
      </p>
      <p class="mt-5 max-w-[44ch] text-lg leading-relaxed text-surface-500 dark:text-surface-400">
        {{ hero.subtitle | translate }}
      </p>
      <mh-check-list class="mt-7 border-t border-surface-200 pt-5 dark:border-surface-700" [items]="guarantees" />
    </section>
    }

    <div class="auth-card w-full justify-self-center lg:justify-self-end max-w-120 sm:rounded-2xl sm:border sm:p-8">
      <router-outlet (activate)="onActivate()" />
    </div>
  </div>
</main>
