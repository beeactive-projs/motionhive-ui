<div class="flex max-w-xl flex-col items-center text-center animate-fade-in">
  <p class="font-heading text-7xl font-extrabold leading-none tracking-[-0.02em] text-surface-900 dark:text-surface-0 sm:text-8xl"
    aria-hidden="true">
    {{ errorCode() }}
  </p>

  <h1 class="mt-8 font-heading text-3xl font-extrabold tracking-[-0.02em] text-surface-900 dark:text-surface-0 sm:text-4xl">
    {{ copyKey() + '.title' | translate }}
  </h1>
  <p class="mt-4 max-w-md text-lg leading-relaxed text-surface-600 dark:text-surface-400">
    {{ copyKey() + '.message' | translate }}
  </p>

  <div class="mt-8 flex w-full flex-col justify-center gap-3 sm:w-auto sm:flex-row">
    <button pButton type="button" size="large" routerLink="/">
      <i class="pi pi-home"></i>
      {{ 'errorPages.goHome' | translate }}
    </button>
    <button pButton type="button" size="large" severity="secondary" outlined (click)="retry()">
      <i class="pi pi-refresh"></i>
      {{ 'button.tryAgain' | translate }}
    </button>
    <button pButton type="button" size="large" severity="secondary" text (click)="goBack()">
      <i class="pi pi-arrow-left"></i>
      {{ 'errorPages.goBack' | translate }}
    </button>
  </div>

  <p class="mt-10 flex flex-col items-center justify-center gap-2 text-sm text-surface-600 dark:text-surface-300 sm:flex-row sm:gap-4">
    <span class="inline-flex items-center gap-2">
      <i class="pi pi-clock" aria-hidden="true"></i>
      {{ 'errorPages.serverError.support' | translate }}
    </span>
    <span class="hidden sm:inline" aria-hidden="true">·</span>
    <span class="inline-flex items-center gap-2">
      <i class="pi pi-envelope" aria-hidden="true"></i>
      <a href="mailto:support@motionhive.fit" class="mh-link">support&#64;motionhive.fit</a>
    </span>
  </p>
</div>
