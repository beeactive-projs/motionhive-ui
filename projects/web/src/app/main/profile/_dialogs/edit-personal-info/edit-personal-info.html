<p-dialog [header]="'profile.editPersonalInfo.title' | translate" [(visible)]="visible" [modal]="true" [style]="{ width: '36rem' }"
  [closable]="true">
  <div class="flex flex-col gap-4 pt-2">

    <div class="grid gap-4 sm:grid-cols-2">
      <div class="flex flex-col gap-2">
        <label for="epiFirstName" class="text-sm font-medium">{{ 'form.label.firstName' | translate }}</label>
        <input id="epiFirstName" type="text" pInputText fluid [ngModel]="form().firstName"
          (ngModelChange)="updateField('firstName', $event)" [placeholder]="'form.label.firstName' | translate" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="epiLastName" class="text-sm font-medium">{{ 'form.label.lastName' | translate }}</label>
        <input id="epiLastName" type="text" pInputText fluid [ngModel]="form().lastName"
          (ngModelChange)="updateField('lastName', $event)" [placeholder]="'form.label.lastName' | translate" />
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label for="epiPhone" class="text-sm font-medium">{{ 'form.label.phone' | translate }}</label>
      <mh-phone-input
        inputId="epiPhone"
        [value]="form().phone"
        (valueChange)="updateField('phone', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium">{{ 'form.label.location' | translate }}</label>
      <mh-location-picker [location]="form().location"
        (locationChange)="updateField('location', $event)" />
      @if (countryLocked()) {
        <span class="text-xs text-surface-400">{{ 'profile.editPersonalInfo.countryLockedHint' | translate }}</span>
      } @else {
        <span class="text-xs text-surface-400">{{ 'profile.editPersonalInfo.locationHint' | translate }}</span>
      }
    </div>

  </div>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" (click)="visible.set(false)">{{ 'button.cancel' | translate }}</button>
    <button pButton type="button" (click)="save()" [disabled]="saving()">
      <i class="pi" [class]="saving() ? 'pi-spinner pi-spin' : 'pi-check'"></i>
      {{ 'button.saveChanges' | translate }}
    </button>
  </ng-template>
</p-dialog>
