<p-dialog
  [header]="'profile.editHandle.title' | translate"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closeOnEscape]="true"
  [style]="{ width: '28rem' }"
  [appendTo]="'body'"
>
  <div class="flex flex-col gap-3">
    <p class="text-sm text-muted-color m-0">
      {{ 'profile.editHandle.intro' | translate }}
      <span class="font-semibold">{{ 'profile.editHandle.introExample' | translate }}</span>.
    </p>

    <label class="flex flex-col gap-1.5">
      <span class="text-sm font-medium">{{ 'form.label.handle' | translate }}</span>
      <span class="p-inputgroup">
        <span class="p-inputgroup-addon">{{ '@' }}</span>
        <input
          pInputText
          name="handle"
          autocomplete="off"
          spellcheck="false"
          [ngModel]="handle()"
          (ngModelChange)="handle.set($event)"
          [maxlength]="maxLength"
          [placeholder]="'profile.editHandle.placeholder' | translate"
        />
      </span>
    </label>

    @if (validationError(); as err) {
      <p-message severity="error" size="small" variant="simple">
        {{ err.key | translate: err.params }}
      </p-message>
    } @else if (!unchanged()) {
      <p class="text-xs text-muted-color m-0">
        {{ 'profile.editHandle.preview' | translate }} <span class="font-semibold">/@{{ normalized() }}</span>
      </p>
    }
  </div>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" [disabled]="saving()" (click)="visible.set(false)">{{ 'button.cancel' | translate }}</button>
    <button pButton type="button" [disabled]="!!validationError() || unchanged() || saving()" (click)="save()">
      <i class="pi" [class]="saving() ? 'pi-spinner pi-spin' : 'pi-check'"></i>
      {{ 'button.save' | translate }}
    </button>
  </ng-template>
</p-dialog>
