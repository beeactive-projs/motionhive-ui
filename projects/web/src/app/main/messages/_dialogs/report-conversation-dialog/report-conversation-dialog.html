<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="!submitting()"
  [dismissableMask]="!submitting()"
  [draggable]="false"
  [resizable]="false"
  [header]="'messages.reportDialog.header' | translate"
  styleClass="mh-report-dialog"
  [style]="{ width: '480px', maxWidth: '94vw' }"
  (onHide)="onHide()"
>
  <p class="mh-report__lead">
    {{ 'messages.reportDialog.leadBefore' | translate }}
    <strong>{{ displayName() }}</strong>
    {{ 'messages.reportDialog.leadAfter' | translate }}
  </p>

  <div class="mh-report__group">
    <div class="mh-report__eyebrow">{{ 'messages.reportDialog.issue' | translate }}</div>
    <div class="mh-report__chips">
      @for (c of categories; track c) {
        <button
          type="button"
          class="mh-report__chip"
          [class.mh-report__chip--active]="category() === c"
          (click)="selectCategory(c)"
        >
          {{ 'messages.reportCategory.' + c | translate }}
        </button>
      }
    </div>
  </div>

  <div class="mh-report__group">
    <label for="mh-report-notes" class="mh-report__eyebrow">{{ 'messages.reportDialog.notes' | translate }}</label>
    <textarea
      pTextarea
      id="mh-report-notes"
      class="mh-report__textarea"
      rows="4"
      [ngModel]="notes()"
      (ngModelChange)="onNotesChange($event)"
      [maxlength]="maxNotes"
      [placeholder]="'messages.reportDialog.notesPlaceholder' | translate"
    ></textarea>
    <div class="mh-report__counter">{{ notes().length }}/{{ maxNotes }}</div>
  </div>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" [disabled]="submitting()" (click)="cancel()">{{ 'button.cancel' | translate }}</button>
    <button pButton type="button" [disabled]="(!canSubmit()) || submitting()" (click)="submit()">
      <i class="pi" [class]="submitting() ? 'pi-spinner pi-spin' : 'pi-flag'"></i>
      {{ 'messages.reportDialog.submit' | translate }}
    </button>
  </ng-template>
</p-dialog>
