@if (flags(); as f) {
  <div class="mh-threat" role="status" aria-live="polite">
    <i class="pi pi-exclamation-triangle mh-threat__icon" aria-hidden="true"></i>
    <div class="mh-threat__body">
      <div class="mh-threat__title">
        {{ 'messages.threat.title' | translate: { reasons: reasons().join(', ') } }}
      </div>
      <div class="mh-threat__copy">{{ 'messages.threat.copy' | translate }}</div>
    </div>
    <button
      type="button"
      class="mh-threat__dismiss"
      (click)="dismiss()"
      [attr.aria-label]="'messages.threat.dismiss' | translate"
    >
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>
}
