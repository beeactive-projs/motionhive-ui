<div class="mh-composer-wrap">
  @if (store.sendError(); as error) {
    <div class="mh-composer-error" role="alert">
      <span class="mh-composer-error__text">{{ error }}</span>
      <button
        type="button"
        class="mh-composer-error__dismiss"
        (click)="dismissError()"
        [attr.aria-label]="'messages.composer.dismissError' | translate"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </div>
  }

  <div
    class="mh-composer"
    [class.mh-composer--disabled]="disabled() || isRateLimited()"
  >
    <textarea
      #textarea
      class="mh-composer__input"
      [ngModel]="value()"
      (ngModelChange)="onModelChange($event)"
      (keydown)="onKeydown($event)"
      [placeholder]="isRateLimited() ? ('messages.composer.rateLimited' | translate: { seconds: limitedSecs() }) : placeholder()"
      [disabled]="disabled()"
      [attr.aria-label]="placeholder()"
      rows="1"
    ></textarea>

    <button
      type="button"
      class="mh-composer__send"
      [disabled]="!canSend()"
      (click)="send()"
      [attr.aria-label]="'messages.composer.sendMessage' | translate"
      [title]="isRateLimited() ? ('messages.composer.rateLimited' | translate: { seconds: limitedSecs() }) : ('button.send' | translate)"
    >
      <i class="pi pi-send" aria-hidden="true"></i>
    </button>
  </div>

  @if (tooLong()) {
    <div class="mh-composer-hint">
      {{ 'messages.composer.maxLength' | translate: { max: maxBodyLength } }}
    </div>
  }
</div>
