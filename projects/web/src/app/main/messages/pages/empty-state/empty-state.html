<div class="mh-empty">
  <mh-hex
    class="mh-empty__hex"
    orientation="pointy"
    tone="amberSoft"
    icon="message"
    [size]="64"
    [round]="8"
    [sheen]="true"
    [shadow]="true"
  />
  <h2 class="mh-empty__title">{{ 'messages.emptyState.title' | translate }}</h2>
  <p class="mh-empty__sub">{{ 'messages.emptyState.sub' | translate }}</p>
</div>
