<div class="flex items-center justify-center min-h-[60vh]">
  <p-card class="w-full max-w-md shadow-md">
    @if (redirecting()) {
      <div class="flex flex-col items-center text-center gap-4 py-8">
        <p-progress-spinner strokeWidth="4" [style]="{ width: '50px', height: '50px' }" />
        <div>
          <h3 class="text-lg font-semibold text-surface-900 dark:text-surface-50 m-0">
            {{ 'payments.onboardingRefresh.redirecting' | translate }}
          </h3>
          <p class="text-surface-500 text-sm mt-2 mb-0">
            {{ 'payments.onboardingRefresh.generating' | translate }}
          </p>
        </div>
      </div>
    } @else if (error()) {
      <div class="flex flex-col items-center text-center gap-4 py-8">
        <i class="pi pi-times-circle text-5xl" style="color: var(--p-red-500)"></i>
        <div>
          <h3 class="text-lg font-semibold text-surface-900 dark:text-surface-50 m-0">
            {{ 'error.dialog.generic' | translate }}
          </h3>
          <p class="text-surface-500 text-sm mt-2 mb-0">
            {{ 'payments.onboardingRefresh.errorBody' | translate }}
          </p>
        </div>
        <button pButton type="button" severity="secondary" [outlined]="true" (click)="retry()">
          <i class="pi pi-refresh"></i>
          {{ 'button.tryAgain' | translate }}
        </button>
      </div>
    }
  </p-card>
</div>
