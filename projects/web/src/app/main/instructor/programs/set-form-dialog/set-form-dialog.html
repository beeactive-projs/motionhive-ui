<p-dialog [(visible)]="visible" [modal]="true" [closable]="!submitting()" [closeOnEscape]="!submitting()"
  [dismissableMask]="!submitting()" [appendTo]="'body'" [style]="{ width: '520px' }"
  [breakpoints]="{ '640px': '95vw' }" styleClass="mh-set-form-dialog" [header]="dialogHeader()">
  <form [formGroup]="form" class="flex flex-col gap-3.5">
    <div
      class="flex items-center gap-2 rounded-lg border border-surface bg-(--p-content-background) px-3 py-2 text-[13px] font-semibold">
      <i class="pi pi-bolt text-primary"></i>
      <span>{{ exercise().exercise?.name ?? ('programs.setForm.exerciseFallback' | translate) }}</span>
    </div>

    <!-- Set type / Number of sets -->
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <div class="flex flex-col gap-1.5">
        <label for="setType" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.setType' | translate }}</label>
        <p-select inputId="setType" [options]="setTypeOptions" formControlName="setType" optionLabel="label"
          optionValue="value" [appendTo]="'body'" class="w-full" />
      </div>
      @if (!isEdit()) {
      <div class="flex flex-col gap-1.5">
        <label for="numSets" class="text-xs font-semibold text-surface-800 dark:text-surface-200">
          {{ 'programs.setForm.numberOfSets' | translate }}
        </label>
        <p-inputnumber inputId="numSets" formControlName="numberOfSets" [min]="1" [max]="20" [showButtons]="true"
          class="w-full" />
      </div>
      }
    </div>

    <!-- Reps range -->
    <div class="flex flex-col gap-1.5">
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div class="flex flex-col gap-1.5">
          <label for="repsMin" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.repsMin' | translate }}</label>
          <p-inputnumber inputId="repsMin" formControlName="repsMin" [min]="0" [max]="1000" [allowEmpty]="true"
            placeholder="—" class="w-full" [attr.aria-invalid]="repsRangeError() !== null"
            [attr.aria-describedby]="repsRangeError() ? 'reps-error' : null" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="repsMax" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.repsMax' | translate }}</label>
          <p-inputnumber inputId="repsMax" formControlName="repsMax" [min]="0" [max]="1000" [allowEmpty]="true"
            placeholder="—" class="w-full" [attr.aria-invalid]="repsRangeError() !== null"
            [attr.aria-describedby]="repsRangeError() ? 'reps-error' : null" />
        </div>
      </div>
      @if (repsRangeError()) {
      <p-message id="reps-error" severity="error" size="small" variant="simple">{{ repsRangeError() }}</p-message>
      }
    </div>

    <!-- Weight / Rest -->
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <div class="flex flex-col gap-1.5">
        <label for="weightKg" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.weightKg' | translate }}</label>
        <p-inputnumber inputId="weightKg" formControlName="weightKg" [min]="0" [max]="9999" [maxFractionDigits]="2"
          [allowEmpty]="true" placeholder="—" class="w-full" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="rest" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.restAfter' | translate }}</label>
        <p-inputnumber inputId="rest" formControlName="restSeconds" [min]="0" [allowEmpty]="true" placeholder="—"
          class="w-full" />
      </div>
    </div>

    <!-- Notes -->
    <div class="flex flex-col gap-1.5">
      <label for="snotes"
        class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
        {{ 'form.label.notes' | translate }}
        <span class="font-medium text-surface-400">{{ 'programs.form.optional' | translate }}</span>
      </label>
      <textarea id="snotes" pTextarea rows="2" formControlName="notes" maxlength="2000"
        [placeholder]="'programs.setForm.notesPlaceholder' | translate" fluid></textarea>
    </div>

    <button pButton
      type="button"
      size="small"
      [text]="true"
      class="self-start"
      [attr.aria-expanded]="showAdvanced()"
      (click)="toggleAdvanced()"
    >
      <i [class]="showAdvanced() ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></i>
      {{ 'programs.setForm.advanced' | translate }}
    </button>

    @if (showAdvanced()) {
    <div class="flex flex-col gap-3.5 border-t border-dashed border-surface pt-3">
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
        <div class="flex flex-col gap-1.5">
          <label for="pct" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.percent1rm' | translate }}</label>
          <p-inputnumber inputId="pct" formControlName="weightPercent1rm" [min]="0" [max]="100"
            [maxFractionDigits]="1" [allowEmpty]="true" placeholder="—" suffix="%" class="w-full" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="rpe" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.rpe' | translate }}</label>
          <p-inputnumber inputId="rpe" formControlName="rpe" [min]="1" [max]="10" [maxFractionDigits]="1"
            [allowEmpty]="true" placeholder="—" class="w-full" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="rir" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.rir' | translate }}</label>
          <p-inputnumber inputId="rir" formControlName="rir" [min]="0" [allowEmpty]="true" placeholder="—"
            class="w-full" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div class="flex flex-col gap-1.5">
          <label for="dur" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.durationSeconds' | translate }}</label>
          <p-inputnumber inputId="dur" formControlName="durationSeconds" [min]="0" [allowEmpty]="true" placeholder="—"
            class="w-full" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="dist" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.setForm.distanceMeters' | translate }}</label>
          <p-inputnumber inputId="dist" formControlName="distanceMeters" [min]="0" [allowEmpty]="true" placeholder="—"
            class="w-full" />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="tempo"
          class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
          {{ 'programs.setForm.tempo' | translate }}
          <span class="font-medium text-surface-400">{{ 'programs.setForm.tempoHint' | translate }}</span>
        </label>
        <input id="tempo" pInputText formControlName="tempo" maxlength="7" [placeholder]="'programs.setForm.tempoPlaceholder' | translate"
          autocomplete="off" fluid [class.ng-invalid]="isFieldInvalid('tempo')"
          [class.ng-dirty]="isFieldInvalid('tempo')" [attr.aria-invalid]="isFieldInvalid('tempo')"
          [attr.aria-describedby]="isFieldInvalid('tempo') ? 'tempo-error' : null" />
        @if (isFieldInvalid('tempo')) {
        <p-message id="tempo-error" severity="error" size="small" variant="simple">{{ getFieldError('tempo')
          }}</p-message>
        }
      </div>
    </div>
    }
  </form>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" [disabled]="submitting()" (click)="cancel()">{{ 'button.cancel' | translate }}</button>
    <button pButton type="button" (click)="submit()" [disabled]="submitting()">
      <i class="pi" [class]="submitting() ? 'pi-spinner pi-spin' : 'pi-check'"></i>
      {{ submitLabel() }}
    </button>
  </ng-template>
</p-dialog>

<p-toast position="top-right" />
