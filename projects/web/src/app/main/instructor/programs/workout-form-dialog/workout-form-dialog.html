<p-dialog [(visible)]="visible" [modal]="true" [closable]="!submitting()" [closeOnEscape]="!submitting()"
  [dismissableMask]="!submitting()" [appendTo]="'body'" [style]="{ width: '40rem' }" [header]="dialogHeader()">
  <form [formGroup]="form" class="flex flex-col gap-3.5">
    <!-- Name -->
    <div class="flex flex-col gap-1.5">
      <label for="wname" class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
        {{ 'programs.workoutForm.name' | translate }} <span class="text-red-500">*</span>
      </label>
      <input #nameInput id="wname" pInputText formControlName="name" maxlength="200" [placeholder]="'programs.workoutForm.namePlaceholder' | translate"
        autocomplete="off" fluid [invalid]="isFieldInvalid('name')" [attr.aria-invalid]="isFieldInvalid('name')"
        [attr.aria-describedby]="isFieldInvalid('name') ? 'wname-error' : null" />
      @if (isFieldInvalid('name')) {
      <p-message id="wname-error" severity="error" size="small" variant="simple">{{ getFieldError('name') }}</p-message>
      }
    </div>

    <!-- Week / Day -->
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5">
        <label for="week" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.form.week' | translate }}</label>
        <p-select inputId="week" [options]="weekOptions()" formControlName="weekIndex" optionLabel="label"
          optionValue="value" [appendTo]="'body'" class="w-full" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="day" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.form.day' | translate }}</label>
        <p-select inputId="day" [options]="dayOptions" formControlName="dayIndex" optionLabel="label"
          optionValue="value" [appendTo]="'body'" class="w-full" />
      </div>
    </div>

    <!-- Phase / Duration -->
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5">
        <label for="phase"
          class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
          {{ 'programs.workoutForm.phase' | translate }}
          <span class="font-medium text-surface-400">{{ 'programs.form.optional' | translate }}</span>
        </label>
        <input id="phase" pInputText formControlName="phase" maxlength="50" [placeholder]="'programs.workoutForm.phasePlaceholder' | translate"
          autocomplete="off" fluid />
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="duration"
          class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
          {{ 'form.label.duration' | translate }}
          <span class="font-medium text-surface-400">{{ 'programs.workoutForm.minutesSuffix' | translate }}</span>
        </label>
        <p-inputnumber inputId="duration" formControlName="estimatedDurationMinutes" [min]="5" [max]="480"
          [allowEmpty]="true" placeholder="—" class="w-full" />
      </div>
    </div>

    <!-- Notes -->
    <div class="flex flex-col gap-1.5">
      <label for="wnotes"
        class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
        {{ 'form.label.notes' | translate }}
        <span class="font-medium text-surface-400">{{ 'programs.form.optional' | translate }}</span>
      </label>
      <textarea id="wnotes" pTextarea rows="3" formControlName="notes" maxlength="2000"
        [placeholder]="'programs.workoutForm.notesPlaceholder' | translate" fluid></textarea>
    </div>
  </form>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" [disabled]="submitting()" (click)="cancel()">{{ 'button.cancel' | translate }}</button>
    <button pButton type="button" (click)="submit()" [disabled]="submitting()">
      <i class="pi" [class]="submitting() ? 'pi-spinner pi-spin' : 'pi-check'"></i>
      {{ submitLabel() }}
    </button>
  </ng-template>
</p-dialog>

<p-toast position="top-right" />
