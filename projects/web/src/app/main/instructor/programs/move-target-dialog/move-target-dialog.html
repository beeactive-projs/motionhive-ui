<p-dialog [(visible)]="visible" [modal]="true" [appendTo]="'body'" [style]="{ width: '26rem' }"
  [breakpoints]="{ '640px': '95vw' }" [header]="dialogHeader()">
  <div class="flex flex-col gap-3.5 pt-1">
    <p class="m-0 text-sm text-muted-color">
      {{ 'programs.moveDialog.where.before' | translate }}
      <strong class="text-color">{{ itemLabel() }}</strong>
      {{ 'programs.moveDialog.where.after' | translate }}
    </p>

    @if (mode() === 'workout') {
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5">
        <label for="moveWeek" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.form.week' | translate }}</label>
        <p-select inputId="moveWeek" [options]="weekOptions()" [ngModel]="targetWeek()"
          (ngModelChange)="targetWeek.set($event)" optionLabel="label" optionValue="value" [appendTo]="'body'"
          class="w-full" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="moveDay" class="text-xs font-semibold text-surface-800 dark:text-surface-200">{{ 'programs.form.day' | translate }}</label>
        <p-select inputId="moveDay" [options]="dayOptions()" [ngModel]="targetDay()"
          (ngModelChange)="targetDay.set($event)" optionLabel="label" optionValue="value" optionDisabled="disabled"
          [appendTo]="'body'" class="w-full" />
      </div>
    </div>
    <p class="m-0 text-2xs text-muted-color">{{ 'programs.moveDialog.daysHint' | translate }}</p>
    } @else {
    <div class="flex flex-col gap-1.5">
      <label for="moveWorkout" class="text-xs font-semibold text-surface-800 dark:text-surface-200">
        {{ 'programs.moveDialog.destination' | translate }}
      </label>
      <p-select inputId="moveWorkout" [options]="workoutOptions()" [ngModel]="targetWorkoutId()"
        (ngModelChange)="targetWorkoutId.set($event)" optionLabel="label" optionValue="value" [appendTo]="'body'"
        class="w-full" [placeholder]="'programs.moveDialog.destinationPlaceholder' | translate" />
    </div>
    <p class="m-0 text-2xs text-muted-color">
      {{ 'programs.moveDialog.exerciseHint' | translate }}
    </p>
    }
  </div>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" (click)="cancel()">{{ 'button.cancel' | translate }}</button>
    <button pButton type="button" [disabled]="!canSubmit()" (click)="submit()"><i class="pi pi-arrow-right"></i> {{ 'programs.moveDialog.move' | translate }}</button>
  </ng-template>
</p-dialog>
