<p-dialog [(visible)]="visible" [modal]="true" [closable]="!submitting()" [closeOnEscape]="!submitting()"
  [dismissableMask]="!submitting()" [appendTo]="'body'" [style]="{ width: '40rem' }" [header]="dialogHeader()" styleClass="program-dialog">
  <form [formGroup]="form" class="flex flex-col gap-3.5">
    <!-- Name -->
    <div class="flex flex-col gap-1.5">
      <label for="name" class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
        Name <span class="text-red-500">*</span>
        <span class="ml-auto text-3xs font-medium text-surface-400">{{ form.controls.name.value.length }} / 200</span>
      </label>
      <input #nameInput id="name" pInputText formControlName="name" maxlength="200"
        placeholder="e.g. Strength foundations — 8 weeks" autocomplete="off" fluid
        [class.ng-invalid]="isFieldInvalid('name')" [class.ng-dirty]="isFieldInvalid('name')"
        [attr.aria-invalid]="isFieldInvalid('name')"
        [attr.aria-describedby]="isFieldInvalid('name') ? 'name-error' : null" />
      @if (isFieldInvalid('name')) {
      <p-message id="name-error" severity="error" size="small" variant="simple">{{ getFieldError('name') }}</p-message>
      }
    </div>

    <!-- Description -->
    <div class="flex flex-col gap-1.5">
      <label for="description"
        class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
        Description <span class="font-medium text-surface-400">— optional</span>
        <span class="ml-auto text-3xs font-medium text-surface-400">{{ form.controls.description.value.length }} /
          2000</span>
      </label>
      <textarea id="description" pTextarea rows="3" formControlName="description" maxlength="2000"
        placeholder="What this program covers, who it's for, how often it should be done…" fluid></textarea>
    </div>

    <!-- Kind / Status -->
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5">
        <label for="kind" class="text-xs font-semibold text-surface-800 dark:text-surface-200">Kind</label>
        <p-select inputId="kind" [options]="kindOptions" formControlName="kind" optionLabel="label"
          optionValue="value" [appendTo]="'body'" class="w-full" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="status" class="text-xs font-semibold text-surface-800 dark:text-surface-200">Status</label>
        <p-select inputId="status" [options]="statusOptions" formControlName="status" optionLabel="label"
          optionValue="value" [appendTo]="'body'" class="w-full" />
      </div>
    </div>

    <!-- Duration / Periodization -->
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5">
        <label for="duration"
          class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
          Duration
          <span class="font-medium text-surface-400">
            — {{ form.controls.durationUnit.value }}, optional
          </span>
        </label>
        <div class="flex items-stretch gap-1.5">
          <p-inputnumber inputId="duration" formControlName="durationValue" [min]="1" [max]="durationMax()"
            [allowEmpty]="true" placeholder="—" class="min-w-0 flex-1" fluid />
          <p-selectbutton [options]="unitOptions" formControlName="durationUnit" [allowEmpty]="false"
            optionLabel="label" optionValue="value" />
        </div>
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="periodization"
          class="text-xs font-semibold text-surface-800 dark:text-surface-200">Periodization</label>
        <p-select inputId="periodization" [options]="periodizationOptions" formControlName="periodizationModel"
          optionLabel="label" optionValue="value" [appendTo]="'body'" class="w-full" />
      </div>
    </div>

    <!-- Goal tags -->
    <div class="flex flex-col gap-1.5">
      <label for="tags" class="flex items-center gap-1.5 text-xs font-semibold text-surface-800 dark:text-surface-200">
        Goal tags <span class="font-medium text-surface-400">— comma-separated, up to 10</span>
      </label>
      <input id="tags" pInputText formControlName="goalTags" placeholder="e.g. hypertrophy, fat loss, beginner"
        autocomplete="off" fluid [class.ng-invalid]="goalTagsError() !== null"
        [class.ng-dirty]="goalTagsError() !== null" [attr.aria-invalid]="goalTagsError() !== null"
        [attr.aria-describedby]="goalTagsError() ? 'tags-error' : null" />
      @if (goalTagsError()) {
      <p-message id="tags-error" severity="error" size="small" variant="simple">{{ goalTagsError() }}</p-message>
      }
    </div>

    @if (!isEdit()) {
    <p
      class="m-0 flex items-start gap-2 rounded-lg border border-surface-200 bg-surface-50 px-3 py-2.5 text-2xs leading-relaxed text-surface-600 dark:border-surface-700 dark:bg-surface-800 dark:text-surface-400">
      <i class="pi pi-info-circle mt-px shrink-0 text-primary"></i>
      After creating the program shell, you'll add weeks, workouts, and exercises from the program detail page.
    </p>
    }
  </form>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" [disabled]="submitting()" (click)="cancel()">Cancel</button>
    <button pButton type="button" (click)="submit()" [disabled]="submitting()">
      <i class="pi" [class]="submitting() ? 'pi-spinner pi-spin' : 'pi-check'"></i>
      {{ submitLabel() }}
    </button>
  </ng-template>
</p-dialog>

<p-toast position="top-right" />
