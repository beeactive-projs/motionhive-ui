<p-dialog
  [header]="(isEdit() ? 'venues.form.editTitle' : 'venues.form.addTitle') | translate"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '36rem' }"
  [closable]="true"
>
  <div class="flex flex-col gap-4 pt-2">
    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium">{{ 'form.label.type' | translate }}</label>
      <p-select
        [options]="kindOptions"
        [ngModel]="form().kind"
        (ngModelChange)="updateField('kind', $event)"
        optionLabel="label"
        optionValue="value"
        [appendTo]="'body'"
        fluid
      >
        <ng-template #selectedItem let-selected>
          @if (selected) {
            <span class="flex items-center gap-2">
              <i [class]="selected.icon"></i>
              <span>{{ selected.label }}</span>
            </span>
          }
        </ng-template>
        <ng-template #item let-option>
          <div class="flex flex-col">
            <span class="flex items-center gap-2 font-medium">
              <i [class]="option.icon"></i>
              {{ option.label }}
            </span>
            <span class="text-xs text-surface-400">{{ option.description }}</span>
          </div>
        </ng-template>
      </p-select>
    </div>

    <div class="flex flex-col gap-2">
      <label for="vfName" class="text-sm font-medium">{{ 'form.label.name' | translate }}</label>
      <input
        id="vfName"
        type="text"
        pInputText
        fluid
        [ngModel]="form().name"
        (ngModelChange)="updateField('name', $event)"
        [placeholder]="'venues.form.namePlaceholder' | translate"
      />
    </div>

    @if (needsAddress()) {
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium">{{ 'venues.form.address' | translate }}</label>
        <mh-location-picker
          [location]="form().location"
          (locationChange)="updateField('location', $event)"
        />
        <span class="text-xs text-surface-400">{{ 'venues.form.addressHint' | translate }}</span>
      </div>
    }

    @if (isOnline()) {
      <div class="flex flex-col gap-2">
        <label for="vfMeetingUrl" class="text-sm font-medium">{{ 'venues.form.meetingUrl' | translate }}</label>
        <input
          id="vfMeetingUrl"
          type="text"
          pInputText
          fluid
          [ngModel]="form().meetingUrl"
          (ngModelChange)="onMeetingUrlChange($event)"
          placeholder="https://zoom.us/j/…"
        />
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium">{{ 'venues.form.meetingProvider' | translate }}</label>
        <p-select
          [options]="meetingProviderOptions"
          [ngModel]="form().meetingProvider"
          (ngModelChange)="updateField('meetingProvider', $event)"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'venues.form.meetingProviderPlaceholder' | translate"
          [appendTo]="'body'"
          fluid
        />
      </div>
    }

    @if (isClientHome()) {
      <div class="flex flex-col gap-2">
        <label for="vfRadius" class="text-sm font-medium">{{ 'venues.form.travelRadius' | translate }}</label>
        <p-inputnumber
          inputId="vfRadius"
          [ngModel]="form().travelRadiusKm"
          (ngModelChange)="updateField('travelRadiusKm', $event)"
          [min]="0"
          [max]="500"
          [placeholder]="'venues.form.travelRadiusPlaceholder' | translate"
          class="w-full"
        />
        <span class="text-xs text-surface-400">{{ 'venues.form.travelRadiusHint' | translate }}</span>
      </div>
    }

    <div class="flex flex-col gap-2">
      <label for="vfNotes" class="text-sm font-medium">{{ 'form.label.notes' | translate }}</label>
      <textarea
        id="vfNotes"
        pTextarea
        rows="3"
        [ngModel]="form().notes"
        (ngModelChange)="updateField('notes', $event)"
        [placeholder]="'venues.form.notesPlaceholder' | translate"
      ></textarea>
    </div>
  </div>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" (click)="close()">{{ 'button.cancel' | translate }}</button>
    <button pButton type="button" (click)="save()" [disabled]="saving()">
      <i class="pi" [class]="saving() ? 'pi-spinner pi-spin' : 'pi-check'"></i>
      {{ (isEdit() ? 'button.saveChanges' : 'venues.section.add') | translate }}
    </button>
  </ng-template>
</p-dialog>
