<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="!sending()"
  [closeOnEscape]="!sending()"
  [dismissableMask]="!sending()"
  [header]="'paymentDialogs.sendInvoiceEmail.title' | translate"
  styleClass="w-full max-w-md"
>
  <div class="flex flex-col gap-4 p-1">
    <p class="text-sm text-surface-700 dark:text-surface-300 m-0">
      {{ 'paymentDialogs.sendInvoiceEmail.intro' | translate }}
    </p>

    <label class="flex flex-col gap-2">
      <span class="text-xs uppercase tracking-wide text-surface-500">{{ 'paymentDialogs.sendInvoiceEmail.sendTo' | translate }}</span>
      <input
        pInputText
        type="email"
        autocomplete="email"
        [ngModel]="email()"
        (ngModelChange)="onEmailChange($event)"
        [disabled]="sending()"
        [placeholder]="'paymentDialogs.sendInvoiceEmail.emailPlaceholder' | translate"
        class="w-full"
      />
      @if (onFileEmail(); as onFile) {
        <span class="text-xs text-surface-500">
          {{ 'paymentDialogs.sendInvoiceEmail.onFile' | translate }} <span class="font-medium">{{ onFile }}</span>
        </span>
      }
    </label>

    @if (isOverride()) {
      <p-message severity="info" [closable]="false" styleClass="w-full">
        <span class="text-xs">
          {{ 'paymentDialogs.sendInvoiceEmail.overrideInfo' | translate }}
        </span>
      </p-message>
    }
  </div>

  <ng-template #footer>
    <div class="flex justify-end gap-2">
      <button pButton type="button" severity="secondary" [text]="true" size="small" [disabled]="sending()" (click)="visible.set(false)">
        {{ 'button.cancel' | translate }}
      </button>
      <button pButton type="button" size="small" [disabled]="!emailLooksValid() || sending()" (click)="send()">
        <i class="pi" [class]="sending() ? 'pi-spinner pi-spin' : 'pi-send'"></i>
        {{ 'button.send' | translate }}
      </button>
    </div>
  </ng-template>
</p-dialog>
