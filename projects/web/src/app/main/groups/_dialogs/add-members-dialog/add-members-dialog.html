<p-dialog [header]="'groups.common.addMembers' | translate" [(visible)]="visible" [modal]="true" [style]="{ width: '38rem' }" [closable]="true">

  @if (loading()) {
  <div class="flex flex-col items-center gap-3 py-8">
    <p-progress-spinner strokeWidth="4" class="w-10 h-10" />
    <span class="text-sm text-surface-500">{{ 'groups.addMembers.loading' | translate }}</span>
  </div>
  } @else {

  <div class="mb-3">
    <input pInputText fluid #filterInput [placeholder]="'groups.addMembers.searchPlaceholder' | translate"
      (input)="dt.filterGlobal(filterInput.value, 'contains')" />
  </div>

  <p-table #dt [value]="availableClients()" [selection]="selectedClients()"
    (selectionChange)="selectedClients.set($event)" selectionMode="multiple"
    [globalFilterFields]="['client.firstName', 'client.lastName', 'client.email']" size="small" stripedRows rowHover
    dataKey="id">

    <ng-template #header>
      <tr>
        <th style="width: 3rem"><p-table-header-checkbox /></th>
        <th>{{ 'form.label.name' | translate }}</th>
        <th>{{ 'form.label.email' | translate }}</th>
      </tr>
    </ng-template>

    <ng-template #body let-client>
      <tr [pSelectableRow]="client">
        <td><p-table-checkbox [value]="client" /></td>
        <td>
          <mh-user-info [user]="client.client" [hex]="true" />
        </td>
        <td>{{ client.client?.email }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3">
          <div class="flex flex-col items-center gap-3 py-8 text-center">
            <i class="pi pi-users text-3xl text-surface-300"></i>
            <p class="text-sm text-surface-500">{{ 'groups.addMembers.empty' | translate }}</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  }

  <ng-template #footer>
    <button pButton type="button" severity="secondary" text (click)="visible.set(false)">{{ 'button.cancel' | translate }}</button>
    <button pButton type="button" [disabled]="(selectedCount() === 0 || loading()) || saving()" (click)="saveMembers()">
      <i class="pi" [class]="saving() ? 'pi-spinner pi-spin' : 'pi-user-plus'"></i>
      @if (selectedCount() > 0) {
      {{ 'groups.addMembers.addCount' | translate: { count: selectedCount() } }}
      } @else {
      {{ 'groups.common.addMembers' | translate }}
      }
    </button>
  </ng-template>
</p-dialog>
