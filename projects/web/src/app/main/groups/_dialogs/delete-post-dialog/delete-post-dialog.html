<p-dialog
  [(visible)]="visible"
  [header]="'groups.deletePost.header' | translate"
  [modal]="true"
  [closable]="!submitting()"
  [closeOnEscape]="!submitting()"
  [dismissableMask]="false"
  [style]="{ width: '420px', maxWidth: '95vw' }">

  <p class="text-sm text-surface-700 dark:text-surface-300">
    {{ 'groups.deletePost.message' | translate }}
  </p>

  <ng-template #footer>
    <div class="flex justify-end gap-2">
      <button pButton type="button" severity="secondary" text [disabled]="submitting()" (click)="cancel()">{{ 'button.cancel' | translate }}</button>
      <button pButton type="button" severity="danger" (click)="submit()" [disabled]="submitting()">
        @if (submitting()) {<i class="pi pi-spinner pi-spin"></i>}
        {{ 'button.delete' | translate }}
      </button>
    </div>
  </ng-template>
</p-dialog>
