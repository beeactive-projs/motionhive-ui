<p-dialog [header]="dialogHeader()" [(visible)]="visible" [modal]="true" [style]="{ width: '40rem' }" [closable]="true">
  <div class="flex flex-col gap-4">
    <!-- Name -->
    <div class="flex flex-col gap-2">
      <label for="groupName" class="text-sm font-medium">{{ 'form.label.name' | translate }} *</label>
      <input id="groupName" type="text" pInputText fluid [(ngModel)]="formName" [placeholder]="'groups.formDialog.namePlaceholder' | translate" />
    </div>

    <!-- Description -->
    <div class="flex flex-col gap-2">
      <label for="groupDescription" class="text-sm font-medium">{{ 'form.label.description' | translate }}</label>
      <textarea pTextarea id="groupDescription" fluid [(ngModel)]="formDescription" [rows]="3"
        [placeholder]="'groups.formDialog.descriptionPlaceholder' | translate"></textarea>
    </div>

    <!-- Join Policy -->
    <div class="flex flex-col gap-2">
      <label for="joinPolicy" class="text-sm font-medium">{{ 'groups.common.joinPolicy' | translate }}</label>
      <p-select id="joinPolicy" [options]="joinPolicyOptions" [(ngModel)]="formJoinPolicy" optionLabel="label"
        optionValue="value" [placeholder]="'groups.formDialog.joinPolicyPlaceholder' | translate" class="w-full" [appendTo]="'body'" />
    </div>

    <!-- Public Toggle -->
    <div class="flex items-center justify-between rounded-lg bg-surface-50 dark:bg-surface-950 p-3">
      <div>
        <span class="text-sm font-medium">{{ 'groups.formDialog.publicLabel' | translate }}</span>
        <p class="text-xs">{{ 'groups.formDialog.publicHint' | translate }}</p>
      </div>
      <p-toggleswitch [(ngModel)]="formIsPublic" />
    </div>

    <!-- Tags -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium">{{ 'groups.common.tags' | translate }}</label>
      <div class="flex gap-2">
        <input type="text" pInputText fluid [(ngModel)]="formTagInput" [placeholder]="'groups.formDialog.tagPlaceholder' | translate"
          (keydown)="onTagKeydown($event)" />
        <button pButton type="button" severity="secondary" [disabled]="!formTagInput.trim()" (click)="addTag()" iconOnly>
          <i class="pi pi-plus"></i>
        </button>
      </div>
      @if (formTags.length > 0) {
      <div class="flex flex-wrap gap-1">
        @for (tag of formTags; track tag) {
        <p-chip [label]="tag" [removable]="true" (onRemove)="removeTag(tag)" rounded />
        }
      </div>
      }
    </div>
  </div>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" text (click)="visible.set(false)">{{ 'button.cancel' | translate }}</button>
    <button pButton type="button" [disabled]="(!formName.trim()) || saving()" (click)="saveGroup()">
      <i class="pi" [class]="saving() ? 'pi-spinner pi-spin' : 'pi-check'"></i>
      {{ (group() ? 'button.saveChanges' : 'groups.formDialog.create') | translate }}
    </button>
  </ng-template>
</p-dialog>
