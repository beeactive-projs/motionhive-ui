<p-card class="mh-side-card shadow-md">
  <ng-template #title>
    <span class="mh-side-card__title">{{ 'groups.ownerCard.title' | translate }}</span>
  </ng-template>

  <div class="mh-side-card__row">
    <mh-hex-avatar [user]="group().instructor" [size]="48" />
    <div class="mh-side-card__lines">
      <span class="mh-side-card__name">{{ ownerName() }}</span>
      @if (ownerEmail()) {
        <span class="mh-side-card__sub">{{ ownerEmail() }}</span>
      }
    </div>
  </div>

  <div class="mh-side-card__actions">
    <button pButton type="button" severity="secondary" outlined size="small" fluid><i class="pi pi-envelope"></i> {{ 'groups.ownerCard.message' | translate }}</button>
    <button pButton type="button" severity="secondary" outlined size="small" fluid><i class="pi pi-user"></i> {{ 'groups.ownerCard.profile' | translate }}</button>
  </div>
</p-card>
