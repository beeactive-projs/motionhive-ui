<p-card class="mh-side-card shadow-md">
  <ng-template #title>
    <span class="mh-side-card__title">Owner actions</span>
  </ng-template>

  <div class="mh-side-card__column-actions">
    <button pButton type="button" fluid (click)="onAddMembers()"><i class="pi pi-user-plus"></i> Add members</button>
    @if (hasActiveLink()) {
    <button pButton type="button" severity="secondary" outlined fluid (click)="onJoinLink()">
      <i class="pi pi-link"></i>
      Copy join link
    </button>
    } @else {
    <button pButton type="button" severity="secondary" outlined fluid (click)="onJoinLink()" [disabled]="generating()">
      <i class="pi" [class]="generating() ? 'pi-spinner pi-spin' : 'pi-link'"></i>
      Generate join link
    </button>
    }
    <button pButton type="button" severity="secondary" outlined fluid (click)="onEditGroup()">
      <i class="pi pi-pencil"></i>
      Edit group
    </button>
  </div>

  @if (hint(); as h) {
  <p-message severity="info" class="mh-side-card__hint mt-5">{{ h }}</p-message>
  }
</p-card>
