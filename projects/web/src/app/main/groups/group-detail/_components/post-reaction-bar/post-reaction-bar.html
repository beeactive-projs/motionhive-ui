<button pButton
  type="button"
  [text]="!reacted()"
  [severity]="reacted() ? 'primary' : 'secondary'"
  size="small"
  rounded
  [disabled]="busy()"
  (click)="toggle()"
>
  <i [class]="reacted() ? 'pi pi-thumbs-up-fill' : 'pi pi-thumbs-up'"></i>
  @if (count() > 0) {
  {{ count() }}
  } @else {
  {{ 'groups.post.like' | translate }}
  }
</button>
