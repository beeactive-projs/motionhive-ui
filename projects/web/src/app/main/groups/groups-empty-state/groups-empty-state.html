<p-card class="gp-empty shadow-md">
  <div class="text-center">
    <mh-hex
      class="mx-auto mb-4 block w-fit"
      orientation="pointy"
      tone="amberSoft"
      icon="users"
      [size]="64"
      [round]="8"
      [sheen]="true"
      [shadow]="true"
    />

    @if (variant() === 'manage') {
      <h3 class="text-lg font-bold">
        {{ 'groups.emptyState.manage.title' | translate }}<span class="text-primary">.</span>
      </h3>
      <p class="max-w-sm mx-auto mb-4 text-sm text-surface-600">
        {{ 'groups.emptyState.manage.message' | translate }}
      </p>
      <div class="flex gap-2.5 justify-center">
        <button pButton type="button" (click)="createGroup.emit()"><i class="pi pi-plus"></i> {{ 'groups.emptyState.manage.cta' | translate }}</button>
      </div>
    } @else {
      <h3 class="text-lg font-bold">
        {{ 'groups.emptyState.discover.title' | translate }}<span class="text-primary">.</span>
      </h3>
      <p class="max-w-sm mx-auto text-sm text-surface-600">
        {{ 'groups.emptyState.discover.message' | translate }}
      </p>
    }
  </div>
</p-card>
