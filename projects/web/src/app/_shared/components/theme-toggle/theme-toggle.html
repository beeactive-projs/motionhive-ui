<button pButton type="button" iconOnly size="small" [rounded]="outlined()" [outlined]="outlined()"
  [text]="!outlined()" [severity]="outlined() ? null : 'secondary'" (click)="toggle()"
  [attr.aria-label]="(isDark() ? 'a11y.switchToLightMode' : 'a11y.switchToDarkMode') | translate">
  <i [class]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"></i>
</button>
