<div
  class="mh-fab"
  [class.mh-fab--hidden]="hidden()"
  [class.mh-fab--force]="force()"
>
  <button pButton
    type="button"
    [rounded]="true"
    (click)="tap.emit()"
    class="mh-fab__btn w-13! h-13! p-0!"
    [attr.aria-label]="label() || 'Create'"
    iconOnly
  >
    <i [class]="icon()"></i>
  </button>
</div>
