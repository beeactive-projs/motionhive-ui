<div class="relative">
  <p-iconfield>
    <p-inputicon class="pi pi-lock" />
    <input #input pInputPassword class="pe-12" fluid pSize="large" [id]="inputId()" [mask]="masked()" [value]="value()"
      [attr.autocomplete]="autocomplete()" [placeholder]="placeholder()" [disabled]="disabled()" [invalid]="showInvalid()"
      [attr.aria-invalid]="showInvalid()" [attr.aria-describedby]="describedBy()" (input)="onInput($event)" />
  </p-iconfield>
  <button pButton type="button" text rounded iconOnly severity="secondary" size="small"
    class="absolute top-1/2 right-1.5 -translate-y-1/2" [disabled]="disabled()" [attr.aria-controls]="inputId()"
    [attr.aria-label]="(masked() ? 'a11y.showPassword' : 'a11y.hidePassword') | translate"
    (click)="masked.set(!masked())">
    <i class="pi" [class]="masked() ? 'pi-eye' : 'pi-eye-slash'"></i>
  </button>
</div>

@if (showRequirements()) {
<ul [id]="requirementsId()" class="flex flex-wrap gap-2" [attr.aria-label]="'form.hint.passwordRules' | translate">
  @for (rule of rules(); track rule.labelKey) {
  <li class="rule inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-light"
    [class.rule--met]="rule.met" [class.rule--failed]="!rule.met && showInvalid()">
    <i class="pi text-[0.6rem]" [class]="rule.met ? 'pi-check-circle' : 'pi-times'" aria-hidden="true"></i>
    <span aria-hidden="true">{{ rule.labelKey | translate }}</span>
    <span class="sr-only">
      {{ (rule.met ? 'a11y.requirementMet' : 'a11y.requirementNotMet') | translate: { label: (rule.labelKey | translate) }
      }}
    </span>
  </li>
  }
</ul>
}
