name: Android → Google Play (testing)

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'ios/**'
      - 'projects/web/**'
      - 'projects/website/**'
      - 'projects/admin/**'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to upload to'
        type: choice
        default: internal
        options: [internal, alpha]

concurrency:
  group: android-play
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      # Job level so the restore step's `if` can see it (a step's own env isn't visible to its `if`).
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      # Must always be higher than the last versionCode uploaded to Play; the
      # offset keeps it above the builds uploaded by hand. Computed in shell:
      # `${{ }}` expressions have no arithmetic.
      - name: Set version code
        run: echo "VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Android only: a plain `cap sync` would also try to sync iOS on a Linux runner.
      - name: Build mobile app (production) & sync Capacitor
        run: |
          npx ng build mobile --configuration production
          npx cap sync android

      - name: Restore google-services.json (push notifications)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fit.motionhive.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          releaseName: ${{ env.VERSION_CODE }} (${{ github.sha }})

      - name: Keep the AAB as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: motionhive-${{ env.VERSION_CODE }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
